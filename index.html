    <linearGradient id="gBore" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".5" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
    <radialGradient id="gTurbo" cx=".4" cy=".4" r=".7"><stop offset="0" stop-color="#d7dbe2"/><stop offset="1" stop-color="#5a6069"/></radialGradient>
    <pattern id="pFins" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="3" fill="#000" fill-opacity=".28"/></pattern>
    <filter id="fShadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>`;
}

const rect = (x, y, w, h, fill, extra = "") => `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" ${extra}/>`;
const rrect = (x, y, w, h, r, fill, extra = "") => `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${r}" fill="${fill}" ${extra}/>`;
const circ = (x, y, r, fill, extra = "") => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${fill}" ${extra}/>`;
const rot = (deg, x, y, inner) => `<g transform="rotate(${deg.toFixed(2)} ${x.toFixed(1)} ${y.toFixed(1)})">${inner}</g>`;
const tr = (x, y, inner) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">${inner}</g>`;
const sheen = (x, y, w, h, r = 0) => `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${r}" fill="url(#gMetal)"/>`;
const label = (x, y, t, anchor = "middle") => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" class="asm-label">${t}</text>`;

// ---------------------------------------------------------------------------
function buildParts(spec, g) {
  const L = g.layout;
  const parts = [];
  const m = (k) => C.mat(spec, k);
  if (g.ev) { evParts(spec, g, parts); return parts; }
  const col = {
    block: tint(m("blockMat")), head: tint(m("headMat")), liner: tint(m("linerMat")), piston: tint(m("pistonMat")), rod: tint(m("rodMat")), crank: tint(m("crankMat")),
    cover: tint(m("coverMat")), intake: tint(m("intakeManMat")), exMan: tint(m("exManMat")), turbine: tint(m("turbineMat")), cam: tint(m("camMat")),
    bore: m("boreCoat").id !== "none" ? tint(m("boreCoat")) : null, crown: m("crownCoat").id !== "none" ? tint(m("crownCoat")) : null,
  };
  const per = L.radial ? Math.ceil(spec.cyl / spec.rows) : Math.ceil(g.n / g.banks.length);
  const cylCount = Math.min(g.n, 64);
  const twoStroke = g.twoStroke;
  const sc = C.scavenge(spec);
  const hasVT = g.hasVT;
  const vt = C.byId(C.VALVETRAINS, spec.valvetrain);
  const asp = spec.aspiration;

  if (g.rotary) return wankelParts(spec, g, col, parts);

  // ----- scale: mm → px. Stroke+rod+bore sets the bank height.
  const B = spec.bore, S = spec.stroke, Lr = spec.rod;
  const bankLen = S / 2 + Lr + S * 0.75 + 20;                     // crank centre → deck (mm)
  const maxAng = Math.max(...g.banks.map((a) => Math.abs(a)), 0);
  const wide = maxAng > 60 || g.opposed || L.radial;
  const depthCount = Math.min(L.radial ? spec.rows : per, 16);
  const stepX = Math.min(22, 170 / Math.max(1, depthCount)), stepY = stepX * 0.45;
  let scale = Math.min((H * 0.52) / (bankLen + B), (W * 0.42) / (wide ? bankLen + B : Math.max(B * 2, bankLen * Math.sin(maxAng * Math.PI / 180) + B)));
  if (g.opposed && !L.delta) scale = Math.min(scale, (W * 0.36) / (bankLen));
  if (L.delta) scale = Math.min(scale, (H * 0.30) / bankLen);
  scale = Math.max(0.45, Math.min(2.4, scale));
  const cx = W / 2 - (depthCount - 1) * stepX / 2;
  const cy = L.radial || g.opposed || L.delta ? H * 0.5 : H * 0.62 + (maxAng > 60 ? -40 : 0);

  // ----- Opposed-piston & Delta drawn as their own thing
  if (g.opposed) return opposedParts(spec, g, col, parts, scale, cx, cy, depthCount, stepX, stepY, B, S, Lr, L.delta);

  // ----- Crankcase / block hull (one polygon per bank + round case)
  const bore = B * scale, deckH = bankLen * scale, caseR = (S * 0.9 + B * 0.3) * scale;
  const bankW = bore * 1.55;
  const bankSvg = (depth) => g.banks.map((ang) => rot(ang, cx, cy, rrect(cx - bankW / 2, cy - deckH, bankW, deckH, 8, col.block) + sheen(cx - bankW / 2, cy - deckH, bankW, deckH, 8))).join("");
  const caseSvg = L.radial
    ? circ(cx, cy, caseR * 1.3, col.block) + circ(cx, cy, caseR * 1.3, "url(#gMetal)")
    : rrect(cx - caseR * 1.25, cy - caseR * 0.6, caseR * 2.5, caseR * 1.5, 18, col.block) + sheen(cx - caseR * 1.25, cy - caseR * 0.6, caseR * 2.5, caseR * 1.5, 18);

  // Depth layers (back to front): cylinders behind, drawn darker
  let backLayers = "";
  for (let d = depthCount - 1; d >= 1; d--) {
    const k = 1 - d * 0.07;
    backLayers += `<g transform="translate(${(d * stepX).toFixed(1)} ${(-d * stepY).toFixed(1)})" opacity="${k.toFixed(2)}">${bankSvg(d).replaceAll(col.block, dark(col.block, 0.9 - d * 0.04))}</g>`;
  }
  // Flywheel behind everything
  const fly = g.flywheel;
  const flyR = Math.max(60, Math.min(190, (fly.inertia * 120 + 60) * (g.vd_l > 10 ? 1.2 : 1)));
  parts.push({ key: "flywheel", title: `Flywheel — ${fly.name}`, svg: tr((depthCount - 1) * stepX + 30, -(depthCount - 1) * stepY - 10, circ(cx, cy, flyR, "#3a3f48") + circ(cx, cy, flyR, "url(#gMetal)") + circ(cx, cy, flyR * 0.82, "#2a2e35") + Array.from({ length: 24 }, (_, i) => rot(i * 15, cx, cy, rect(cx - 4, cy - flyR, 8, 10, "#50565f"))).join("")) });
  // Air-cooling fins or radiator
  const cooling = C.byId(C.COOLING, spec.cooling);
  if (cooling.air) {
    parts.push({ key: "cooling", title: "Air cooling fins", svg: g.banks.map((ang) => rot(ang, cx, cy, rect(cx - bankW / 2 - 14, cy - deckH + 10, bankW + 28, deckH - 30, "url(#pFins)") + rect(cx - bankW / 2 - 14, cy - deckH + 10, bankW + 28, deckH - 30, "none", `stroke="${dark(col.block, 0.55)}" stroke-width="2"`))).join("") });
  } else if (cooling.id !== "keel") {
    const rw = Math.min(260, 120 + g.vd_l * 14) * cooling.cap ** 0.4, rh = 36;
    parts.push({ key: "cooling", title: `Cooling — ${cooling.name}`, svg: tr(0, 0, rrect(cx - rw / 2, 40, rw, rh, 6, "#2d3340") + rect(cx - rw / 2 + 6, 46, rw - 12, rh - 12, "url(#pFins)") + rrect(cx - rw / 2 - 10, 36, 10, rh + 8, 3, "#444a55") + rrect(cx + rw / 2, 36, 10, rh + 8, 3, "#444a55") + label(cx, 40 + rh + 16, cooling.name)) });
  } else {
    parts.push({ key: "cooling", title: "Keel cooling", svg: tr(0, 0, rrect(cx - 120, 40, 240, 26, 6, "#2d3a44") + label(cx, 84, "raw-water keel cooler")) });
  }

  parts.push({ key: "block", title: `Block — ${m("blockMat").name} (${C.byId(C.BUILD_TECHNIQUES, spec.blockTech).name})`, svg: backLayers + bankSvg(0) + caseSvg });

  // Oil pan / dry sump
  const oil = C.byId(C.OILING, spec.oiling);
  const panW = caseR * 2.3, panH = oil.id === "dry" ? 26 : oil.twoStroke ? 14 : 58 + (oil.id === "baff" ? 8 : 0);
  let panSvg = rrect(cx - panW / 2, cy + caseR * 0.9 - 4, panW, panH, 10, col.cover) + sheen(cx - panW / 2, cy + caseR * 0.9 - 4, panW, panH, 10);
  if (oil.id === "dry") panSvg += rrect(cx + panW / 2 + 40, cy - 40, 48, 150, 10, "#3c424c") + sheen(cx + panW / 2 + 40, cy - 40, 48, 150, 10) + label(cx + panW / 2 + 64, cy + 130, "dry-sump tank");
  if (oil.id === "baff") panSvg += rect(cx - panW / 2 + 10, cy + caseR * 0.9 + 10, panW - 20, 3, "#000a");
  parts.push({ key: "pan", title: `Oil system — ${oil.name}; covers ${m("coverMat").name}`, svg: panSvg });

  // Crank, rods, pistons (front cylinder of each bank, pistons shown in-bore through a cutaway)
  const r = S / 2 * scale, rodPx = Lr * scale;
  let crankSvg = circ(cx, cy, r * 0.42 + 8, col.crank) + circ(cx, cy, r * 0.42 + 8, "url(#gMetal)");
  let rodSvg = "", pistonSvg = "", linerSvg = "";
  const bearCol = tint(m("bearingMat"));
  g.banks.forEach((ang, bi) => {
    const theta = (bi * 2 * Math.PI) / Math.max(1, g.banks.length) + 0.6;   // static crank pose per bank
    const a = ang * Math.PI / 180;
    // positions in bank frame (y up along bank)
    const pinX = r * Math.sin(theta), pinY = r * Math.cos(theta);
    const pistY = pinY + Math.sqrt(Math.max(0, rodPx * rodPx - pinX * pinX));
    const toWorld = (x, y) => [cx + x * Math.cos(a) + y * Math.sin(a), cy + x * Math.sin(a) - y * Math.cos(a)];
    const [px, py] = toWorld(pinX, pinY);
    const [wx, wy] = toWorld(0, pistY);
    crankSvg += `<line x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="${col.crank}" stroke-width="${(r * 0.55 + 6).toFixed(1)}" stroke-linecap="round"/>` + circ(px, py, r * 0.3 + 5, bearCol) + circ(px, py, r * 0.3 + 2, col.crank);
    rodSvg += `<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${wx.toFixed(1)}" y2="${wy.toFixed(1)}" stroke="${col.rod}" stroke-width="${Math.max(8, bore * 0.14).toFixed(1)}" stroke-linecap="round"/>` + circ(wx, wy, bore * 0.09 + 3, tint(m("pinMat")));
    const pistH = bore * (twoStroke ? 0.95 : 0.62);
    const bx = cx - bore / 2, by0 = cy - deckH + 6;
    linerSvg += rot(ang, cx, cy, rect(bx - 6, by0, bore + 12, deckH - caseR * 0.5, col.liner) + rect(bx, by0, bore, deckH - caseR * 0.5, col.bore || dark(col.liner, 0.55)) + rect(bx, by0, bore, deckH - caseR * 0.5, "url(#gBore)")
      + (twoStroke && !sc.head ? rect(bx - 8, by0 + deckH * 0.42, 10, bore * 0.22, "#111") + rect(bx + bore - 2, by0 + deckH * 0.48, 10, bore * 0.16, "#111") : ""));
    const pistTop = cy - pistY - bore * 0.1;
    pistonSvg += rot(ang, cx, cy, rrect(cx - bore / 2 + 2, pistTop, bore - 4, pistH, 4, col.piston) + sheen(cx - bore / 2 + 2, pistTop, bore - 4, pistH, 4)
      + (col.crown ? rect(cx - bore / 2 + 2, pistTop, bore - 4, 6, col.crown) : "")
      + rect(cx - bore / 2 + 2, pistTop + pistH * 0.18, bore - 4, 3, tint(m("ringCoat")) ) + rect(cx - bore / 2 + 2, pistTop + pistH * 0.30, bore - 4, 3, "#333")
      + (m("skirtCoat").id !== "none" ? rect(cx - bore / 2 + 2, pistTop + pistH * 0.55, bore - 4, pistH * 0.45, dark(col.piston, 0.8)) : ""));
  });
  parts.push({ key: "liner", title: `Liner ${m("linerMat").name}${col.bore ? ", bore " + m("boreCoat").name : ""}`, svg: linerSvg });
  parts.push({ key: "crank", title: `Crankshaft — ${m("crankMat").name}, ${C.byId(C.BEARING_TYPES, spec.bearingType).name}, ${m("bearingMat").name}`, svg: crankSvg });
  parts.push({ key: "rod", title: `Rods — ${m("rodMat").name} (${C.byId(C.BUILD_TECHNIQUES, spec.rodTech).name})`, svg: rodSvg });
  parts.push({ key: "piston", title: `Pistons — ${m("pistonMat").name} (${C.byId(C.BUILD_TECHNIQUES, spec.pistonTech).name}), CR ${spec.cr}:1`, svg: pistonSvg });

  // Heads & cam covers
  if (!C.noHead(spec)) {
    const headH = bore * (hasVT ? (vt.pushrod ? 0.55 : 0.75) : 0.35);
    const headW = bankW + 10;
    let headSvg = "";
    const headBanks = L.oneHead ? [0] : g.banks;
    headBanks.forEach((ang) => {
      const inner = rrect(cx - headW / 2, cy - deckH - headH, headW, headH, 6, col.head) + sheen(cx - headW / 2, cy - deckH - headH, headW, headH, 6)
        + rect(cx - headW / 2, cy - deckH - 4, headW, 4, tint(m("gasketMat")))
        + (hasVT ? valveSvg(cx, cy - deckH, bore, spec, vt, col, m) : "")
        + (hasVT && !vt.pushrod && !vt.sleeve ? rrect(cx - headW / 2 + 6, cy - deckH - headH - 22, headW - 12, 26, 8, col.cover) + sheen(cx - headW / 2 + 6, cy - deckH - headH - 22, headW - 12, 26, 8) : "")
        + (hasVT && vt.pushrod ? rrect(cx - headW / 2 + 8, cy - deckH - headH - 16, headW - 16, 18, 6, col.cover) : "")
        + (vt.sleeve && hasVT ? rect(cx - bore / 2, cy - deckH - headH + 4, bore, headH - 8, "none", `stroke="${col.cam}" stroke-width="4" stroke-dasharray="6 6"`) : "")
        + (!hasVT && twoStroke ? circ(cx, cy - deckH - headH * 0.4, 7, "#d9d2c0") + rect(cx - 3, cy - deckH - headH - 14, 6, 14, "#c9c2b0") : "");
      headSvg += rot(ang, cx, cy, L.oneHead ? inner.replaceAll(`width="${headW.toFixed(1)}"`, `width="${(headW * 1.6).toFixed(1)}"`).replaceAll(`x="${(cx - headW / 2).toFixed(1)}"`, `x="${(cx - headW * 0.8).toFixed(1)}"`) : inner);
    });
    const vtName = hasVT ? `${vt.name}, ${spec.valves} valves` : twoStroke ? "ported two-stroke head" : "";
    parts.push({ key: "head", title: `Head — ${m("headMat").name}; ${vtName}; gasket ${m("gasketMat").name}`, svg: headSvg });
  }

  // Intake: plenum between banks (V) or on the left (inline), ITBs = stacks, carb = bowl on top
  const intake = C.byId(C.INTAKES, spec.intake);
  const inj = C.byId(C.INJECTION, spec.injection);
  const topY = cy - deckH - bore * 0.8 - (hasVT && !vt.pushrod ? 26 : 10);
  const inV = g.banks.length === 2 && maxAng > 20 && maxAng < 80;
  let intSvg = "";
  const runLen = Math.max(24, Math.min(140, spec.runner * 0.25));
  if (L.radial) {
    intSvg = circ(cx, cy, caseR * 0.9, dark(col.intake, 0.9)) + label(cx, cy + caseR * 1.9, "rear induction ring");
  } else if (intake.id === "itb") {
    const cnt = Math.min(depthCount, 8);
    if (inV) intSvg = Array.from({ length: cnt }, (_, i) => tr(i * stepX * 1.05, -i * stepY, rrect(cx - 13, topY - runLen, 26, runLen, 6, col.intake) + rrect(cx - 19, topY - runLen - 30, 38, 30, 8, "#2b2f36"))).join("");
    else { const hx = cx - bankW / 2; intSvg = Array.from({ length: cnt }, (_, i) => tr(i * stepX * 0.35, -i * stepY * 0.5, rrect(hx - runLen - 4, topY + 18, runLen + 8, 24, 6, col.intake) + rrect(hx - runLen - 34, topY + 12, 32, 36, 8, "#2b2f36"))).join(""); }
  } else {
    const pw = inV ? Math.max(90, bore * 1.6) : Math.max(80, bore * 1.1), ph = intake.id === "log" || intake.id === "updraft" ? 34 : 56;
    const runH = Math.max(18, runLen * 0.6);
    const pX = inV ? cx - pw / 2 : cx - bankW / 2 - pw - runH;
    const pY = inV ? (intake.id === "updraft" ? cy - deckH * 0.5 : topY - ph - runLen * 0.5) : (intake.id === "updraft" ? cy - deckH * 0.35 : topY + 8);
    intSvg = rrect(pX, Math.max(4, pY), pw, ph, 12, col.intake) + sheen(pX, Math.max(4, pY), pw, ph, 12);
    if (inV) { for (let i = 0; i < Math.min(depthCount, 8); i++) intSvg += rrect(pX + 10 + i * Math.min(stepX, (pw - 30) / Math.max(1, Math.min(depthCount, 8))), pY + ph - 4, 14, runLen * 0.5 + 6, 4, dark(col.intake, 0.85)); }
    else { for (let i = 0; i < Math.min(depthCount, 3); i++) intSvg += rrect(pX + pw - 4, Math.max(4, pY) + 10 + i * 14, runH + 8, 10, 4, dark(col.intake, 0.85)); }
    if (intake.id === "varlen") intSvg += rect(pX + 8, Math.max(4, pY) + ph / 2 - 3, pw - 16, 6, "#000a");
    if (inj.id === "carb") intSvg += rrect(pX + pw / 2 - 26, Math.max(4, pY) - 44, 52, 44, 8, "#b8ad8c") + rrect(pX + pw / 2 - 16, Math.max(4, pY) - 68, 32, 24, 6, "#2b2f36");
    if (inj.id === "mixer") intSvg += rrect(pX + pw / 2 - 20, Math.max(4, pY) - 34, 40, 34, 16, "#8b929c");
  }
  parts.push({ key: "intake", title: `Intake — ${intake.name}, ${m("intakeManMat").name}, runners ${spec.runner} mm`, svg: intSvg });

  // Fuel system: injectors / rail / pump; spark plugs or glow plugs
  let fsSvg = "";
  const ign = spec.ignition;
  const plugCol = ign === "ci" ? "#c47f3a" : "#e8e4dc";
  g.banks.forEach((ang) => {
    if (C.noHead(spec)) return;
    fsSvg += rot(ang, cx, cy, rect(cx - 4, cy - deckH - bore * 0.75 - 22, 8, 22, plugCol) + circ(cx, cy - deckH - bore * 0.75 - 24, 6, "#444"));
    if (inj.id === "pfi" || inj.id === "dipfi" || inj.id === "tbi") fsSvg += rot(ang, cx, cy, rect(cx - bankW / 2 - 8, cy - deckH - 18, 10, 20, "#444a55") + rect(cx - bankW / 2 - 12, cy - deckH - 22, 18, 6, "#8b929c"));
    if (inj.id === "di" || inj.id === "dipfi" || inj.ci) fsSvg += rot(ang, cx, cy, rect(cx + bore * 0.28, cy - deckH - bore * 0.7 - 10, 8, 26, "#8b929c") + (inj.ci ? rect(cx - bankW / 2, cy - deckH - bore * 0.72 - 24, bankW, 8, "#656b75") : ""));
  });
  if (inj.ci) fsSvg += rrect(cx - caseR * 1.25 - 40, cy - 10, 36, 70, 8, "#3a4049") + label(cx - caseR * 1.25 - 22, cy + 78, inj.id === "crdi" ? "rail pump" : "injection pump");
  if (spec.knockCtrl && inj.knock_ctrl && !g.ci) fsSvg += circ(cx + caseR * 1.1, cy - caseR * 0.3, 7, "#4cc9f0");
  parts.push({ key: "fuelsys", title: `${C.byId(C.IGNITIONS, ign).name}; ${inj.name}; ${g.fuel.name}`, svg: fsSvg });

  // Exhaust manifold / headers: tubes leaving the outside of each bank, bending down
  const header = C.byId(C.HEADERS, spec.header);
  let hdSvg = "";
  const exSide = (ang) => (ang >= 0 ? 1 : -1);
  g.banks.forEach((ang, bi) => {
    const side = g.banks.length === 1 ? 1 : (inV ? exSide(ang) : exSide(ang) || 1);
    const sx = cx + side * (bankW / 2 + 4);
    const sy = cy - deckH - bore * 0.35;
    const tube = Math.max(8, bore * 0.16);
    const tubes = Math.min(depthCount, 6);
    for (let i = 0; i < tubes; i++) {
      const ox = i * stepX, oy = -i * stepY;
      const len = header.id === "cast" ? 40 : header.id === "short" ? 70 : header.id === "open" ? 150 : 110;
      const d = header.id === "open" ? `M ${sx + ox} ${sy + oy} l ${side * 20} 0 l ${side * 10} -${len}` : `M ${sx + ox} ${sy + oy} q ${side * len * 0.6} 0 ${side * len * 0.6} ${len * 0.9}`;
      hdSvg += rot(ang, cx, cy, `<path d="${d}" fill="none" stroke="${col.exMan}" stroke-width="${tube}" stroke-linecap="round" opacity="${(1 - i * 0.08).toFixed(2)}"/>`);
    }
    if (header.id === "chamber") hdSvg += rot(ang, cx, cy, `<path d="M ${sx + side * 60} ${sy + 60} l ${side * 40} 90 l 0 110 l ${-side * 40} 70" fill="none" stroke="${col.exMan}" stroke-width="${tube * 3.2}" stroke-linecap="round" stroke-linejoin="round"/>`);
    if (header.id !== "open" && header.id !== "chamber") hdSvg += rot(ang, cx, cy, rrect(sx + side * len0(header) - 14, sy + 90, 28, 40, 10, dark(col.exMan, 0.85)));
  });
  parts.push({ key: "header", title: `Exhaust — ${header.name}, ${m("exManMat").name}`, svg: hdSvg });
  const exhaust = C.byId(C.EXHAUSTS, spec.exhaust);
  if (exhaust.id !== "none") parts.push({ key: "exhaust", title: exhaust.name, svg: rrect(cx + caseR * 1.3 + 20, cy + 60, 120, 22, 11, "#4a5059") + (exhaust.id === "stock" ? rrect(cx + caseR * 1.3 + 60, cy + 52, 60, 38, 10, "#3d434c") : "") + label(cx + caseR * 1.3 + 80, cy + 106, exhaust.name) });

  // Boost hardware
  if (asp !== "na" || (twoStroke && sc.blower)) {
    let bSvg = "";
    const tR = 22 + spec.turboSize * 0.5;
    const turboAt = (x, y, k = 1) => circ(x, y, tR * k, "url(#gTurbo)") + circ(x, y, tR * 0.55 * k, col.turbine) + circ(x + tR * 1.1 * k, y + 6, tR * 0.8 * k, "#3b4149") + circ(x + tR * 1.1 * k, y + 6, tR * 0.45 * k, "#9aa1aa");
    const side = g.banks.length === 1 ? 1 : 1;
    const tx = cx + side * (caseR * 1.25 + tR + 30), ty = cy - deckH * 0.55;
    if (asp === "turbo" || asp === "twinch" || asp === "etc") bSvg += turboAt(tx, ty);
    if (asp === "twin") bSvg += turboAt(tx, ty) + turboAt(cx - (caseR * 1.25 + tR + 30), ty);

// What Automation's engine designer can actually build, and the nearest stand-in.
// Automation: four-stroke petrol only; I3–I6, V6/V8/V10/V12/V16, B4/B6 (boxer); no diesel, no two-stroke, no rotary.
function automationFit(spec, g) {
  const L = C.byId(C.LAYOUTS, spec.layout);
  const n = g.n;
  const notes = [];
  if (g.ev) return "**Automation fit:** Automation cannot build electric drivetrains. Use the .jbeam export directly in BeamNG, or stand in with any petrol engine of similar peak power when building the car body.";
  if (!g.e.none) notes.push(`Automation has no ${g.e.hyb.name.toLowerCase()} option; build the combustion engine only. The merge tool applies the combined torque curve.`);
  if (g.rotary) notes.push(`Automation has no rotary — use a ${Math.min(6, Math.max(4, n * 2))}-cylinder boxer of ${g.vd_l.toFixed(1)} L.`);
  if (g.strokes !== 4 || g.opposed) notes.push("Automation only builds four-strokes. Use a four-stroke of about " + (g.vd_l * 1.6).toFixed(1) + " L to approximate the output.");
  if (g.ci) notes.push("Automation has no diesel. Stand in with a turbo petrol engine of the same displacement and a low rev limit; the merge tool will still apply this torque curve.");
  const okI = spec.layout === "I" && n >= 3 && n <= 6;
  const okV = spec.layout === "V" && [6, 8, 10, 12, 16].includes(n);
  const okB = (spec.layout === "B" || spec.layout === "F") && [4, 6].includes(n);
  if (!(okI || okV || okB)) {
    let stand = "an inline-4";
    if (n >= 10) stand = "a V12 or V16";
    else if (n >= 7) stand = "a V8";
    else if (n === 6) stand = spec.layout === "B" ? "a boxer-6" : "a V6 or inline-6";
    else if (n === 5) stand = "an inline-5";
    else if (n <= 2) stand = "an inline-3";
    notes.push(`${L.name} with ${n} cylinders is not in Automation (it offers I3–I6, V6/V8/V10/V12/V16, B4/B6). Build ${stand} of ${g.vd_l.toFixed(1)} L as the stand-in.`);
  }
  if (!notes.length) return "This configuration exists in Automation's engine designer.";
  return "**Automation fit:** " + notes.join(" ");
}

function groupedSelect(f, spec) {
  const sel = document.createElement("select");
  const isMat = f.type === "material";
  const list = isMat ? C.MATERIALS : C.FUELS;
  const suitable = isMat ? list.filter((m) => m.roles.includes(f.role) || (f.coating ? m.id === "none" : false)) : list.filter((x) => x.ign?.includes(spec.ignition));
  const rest = list.filter((x) => !suitable.includes(x) && x.id !== "custom");
  const custom = list.find((x) => x.id === "custom");
  const add = (label, items) => { if (!items.length) return; const og = document.createElement("optgroup"); og.label = label; for (const o of items) { const op = document.createElement("option"); op.value = o.id; op.textContent = o.name; og.appendChild(op); } sel.appendChild(og); };
  add(isMat ? "Suitable for this part" : `Works with ${C.byId(C.IGNITIONS, spec.ignition).name.split(" ")[0].toLowerCase()} ignition`, suitable);
  if (isMat) { for (const grp of C.MATERIAL_GROUPS) { if (grp === "Custom") continue; const items = rest.filter((m) => m.group === grp && (f.coating ? m.coating : !m.coating)); add(`All other — ${grp}`, items); } }
  else { for (const grp of C.FUEL_GROUPS) { if (grp === "Custom") continue; add(`Other — ${grp}`, rest.filter((x) => x.group === grp)); } }
  add("Custom", [custom]);
  return sel;
}

class Builder {

    this.current = GROUP_LIST[0].id;

  show(id) {

  $("dynoTable").innerHTML = `<div class="table-wrap"><table><thead><tr><th>rpm</th><th>N·m</th><th>lb·ft</th><th>hp</th><th>VE %</th><th>${spec.aspiration === "na" ? "MAP kPa" : "boost psi"}</th><th>λ</th><th>timing</th><th>Pmax bar</th><th>EGT °C</th><th>BSFC g/kWh</th></tr></thead><tbody>${sw.pts.filter((p, i) => i % (sw.pts.length > 60 ? 5 : 2) === 0).map((p) => `<tr><td>${p.rpm}</td><td>${Math.round(p.torque)}</td><td>${Math.round(p.torque * 0.7376)}</td><td>${Math.round(p.powerHp)}</td><td>${Math.round(p.ve * 100)}</td><td>${spec.aspiration === "na" ? Math.round(p.map_kpa) : p.boost_psi.toFixed(1)}</td><td>${p.lambda.toFixed(2)}</td><td>${p.timing}°${p.retarded ? ` <span class="warn">(−${p.retarded})</span>` : ""}</td><td>${Math.round(p.pmax)}</td><td>${Math.round(p.egt_c)}</td><td>${isFinite(p.bsfc) ? Math.round(p.bsfc) : "—"}</td></tr>`).join("")}</tbody></table></div>`;
}

// ---------------------------------------------------------------------------
// Export tab
function renderExport() {
  const spec = state.spec;
  const rot = C.isRotary(spec);
  const grid = $("exportGrid");
  grid.innerHTML = `
    <div class="export-card">
      <span class="pill ok">BeamNG.drive</span>
      <h2>${C.isEV(spec) ? "Electric motor + battery for BeamNG (.jbeam)" : "Engine part for BeamNG (.jbeam)"}</h2>
      ${C.isEV(spec) ? "<p>Electric builds export an <code>electricMotor</code> powertrain device plus an <code>electricBattery</code> energy store. The torque table comes from the motor model; you will need to point the car's driveshaft input at <code>mainEngine</code> as for any BeamNG EV mod.</p>" : ""}
      <p>A ready-to-use <code>mainEngine</code> part with this engine's torque curve, idle, rev limit, inertia, friction, thermals${spec.aspiration !== "na" ? " and forced-induction block" : ""}. Install: unzip any BeamNG mod of a car you like, drop this file into its <code>vehicles/&lt;car&gt;/</code> folder, then pick the engine in the Parts menu.</p>
      <div class="btn-row"><button class="primary" id="exJbeam">Download .jbeam</button><button id="exJbeamPreview">Preview</button></div>
      <textarea id="exJbeamText" class="hidden" readonly></textarea>
    </div>
    <div class="export-card">
      <span class="pill ok">Automation → BeamNG</span>
      <h2>Merge into an Automation export</h2>
      <p>Automation cannot import engines, but its BeamNG export is just text. Build any car in Automation, export it to BeamNG, then upload the <code>camso_engine_*.jbeam</code> from <code>vehicles/&lt;yourcar&gt;/</code> here. Engine Forge replaces its torque table, idle, rev limit, inertia${spec.aspiration !== "na" ? " and boost curve" : ""} with this engine and gives you the patched file to drop back in.</p>
      <div class="btn-row"><button class="primary" id="exMergePick">Choose camso_engine_*.jbeam</button></div>
      <input id="exMergeFile" type="file" accept=".jbeam,.json,text/plain" hidden />
      <p id="exMergeStatus"></p>
    </div>
    <div class="export-card">
      <span class="pill ok">Automation</span>
      <h2>Automation Engine Designer build sheet</h2>
      <p>Every setting translated to Automation's Family / Variant tabs so you can rebuild the engine there by hand, plus the full dyno table for comparison.</p>
      <div class="btn-row"><button class="primary" id="exSheet">Download build sheet (.md)</button><button id="exSheetCopy">Copy to clipboard</button></div>
    </div>
    <div class="export-card">
      <span class="pill ${rot ? "warn" : "ok"}">engine-sim</span>
      <h2>AngeTheGreat engine-sim script (.mr)</h2>
      <p>${rot ? "engine-sim only models piston engines, so rotaries cannot be exported." : "Hear it. A complete Piranha script with your bore, stroke, rod, firing order, bank angles, cam duration/lift/LSA, valve flow and timing curve. Put it in <code>assets/engines/</code> and import it from <code>assets/main.mr</code>."}</p>
      <div class="btn-row"><button class="primary" id="exMr" ${rot ? "disabled" : ""}>Download .mr</button></div>
    </div>
    <div class="export-card">
      <span class="pill">Save</span>
      <h2>Engine Forge save file (.json)</h2>
      <p>Everything on the Build tab. Load it back with "Load file" on the Build tab, or share it with a friend.</p>
      <div class="btn-row"><button class="primary" id="exJson">Download save</button></div>
    </div>
    <div class="export-card">
      <span class="pill">iPhone</span>
      <h2>Install on your iPhone home screen</h2>
      <ol>
        <li>Open this page in Safari (not inside another app).</li>
        <li>Tap the Share button (square with an arrow).</li>
        <li>Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li>
      </ol>
      <p>It opens full-screen like an app and works offline after the first visit. Android: Chrome menu → "Add to Home screen".</p>
    </div>`;
  $("exJbeam").addEventListener("click", () => { const j = X.buildJbeam(spec); X.download(j.filename, j.text, "application/json"); toast(`Downloaded ${j.filename}`); });
  $("exJbeamPreview").addEventListener("click", () => { const ta = $("exJbeamText"); ta.classList.toggle("hidden"); if (!ta.classList.contains("hidden")) ta.value = X.buildJbeam(spec).text; });
  $("exMergePick").addEventListener("click", () => $("exMergeFile").click());
  $("exMergeFile").addEventListener("change", async () => {
    const f = $("exMergeFile").files[0]; if (!f) return;
    const txt = await f.text();
    if (!/"mainEngine"\s*:/.test(txt)) { $("exMergeStatus").textContent = "That file has no mainEngine section — pick the camso_engine_*.jbeam from the exported vehicle folder."; return; }
    const res = X.patchAutomationJbeam(txt, spec);
    X.download(f.name, res.text, "application/json");
    $("exMergeStatus").textContent = `Patched: ${res.changes.join(", ")}. Replace the original file in the vehicle folder with the download.`;
    $("exMergeFile").value = "";
  });
  $("exSheet").addEventListener("click", () => { const s = X.buildSheet(spec, state.analysis || E.analyze(spec)); X.download(s.filename, s.text, "text/markdown"); toast("Build sheet downloaded"); });
  $("exSheetCopy").addEventListener("click", async () => { const s = X.buildSheet(spec, state.analysis || E.analyze(spec)); try { await navigator.clipboard.writeText(s.text); toast("Copied"); } catch { X.download(s.filename, s.text, "text/markdown"); } });
  $("exMr").addEventListener("click", () => { const m = X.buildMr(spec); if (m.error) { toast(m.error); return; } X.download(m.filename, m.text); toast(`Downloaded ${m.filename}`); });
  $("exJson").addEventListener("click", () => { const j = X.buildJson(spec); X.download(j.filename, j.text, "application/json"); });
}

// ---------------------------------------------------------------------------
// Boot
analyze();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
window.__forge = state; // for QA

// Keep the sticky engine viewport just below the app header on phones.
function setStickyTop() { const h = document.querySelector("header.topbar"); if (h) document.documentElement.style.setProperty("--sticky-top", `${Math.round(h.getBoundingClientRect().bottom)}px`); }
setStickyTop(); window.addEventListener("resize", setStickyTop);

// 3D tab: builds the engine from state.spec. A failure here must never break the rest of the app.
try { __M["engine3d"].mountEngine3D({ state, sim, C, E, cylinderGeometry: __M["render"].cylinderGeometry, tint: __M["assembly"].tint }); }
catch (err) { console.error("3D tab failed to mount", err); }


})();
</script>
</body>
</html>
