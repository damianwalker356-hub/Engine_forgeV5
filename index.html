  <style>
:root {
  --bg: #0f1115;
  --bg-2: #15181e;
  --panel: #1a1e26;
  --panel-2: #20252f;
  --line: #2a303b;
  --line-2: #363d4a;
  --text: #e8e6e1;
  --text-2: #a7adb8;
  --text-3: #6f7784;
  --accent: #ff8a3d;
  --accent-2: #ffb27a;
  --power: #4cc9f0;
  --torque: #ff8a3d;
  --ok: #58c27d;
  --warn: #f5c451;
  --danger: #ff5a5a;
  --font-display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --radius: 10px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { padding-top: var(--sat); min-height: 100dvh; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0; letter-spacing: 0.01em; }
h2 { font-size: 20px; }
h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-2); margin-bottom: var(--space-3); }
small { color: var(--text-3); font-size: 12.5px; line-height: 1.4; display: block; }
button { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--text); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 14px; cursor: pointer; min-height: 40px; touch-action: manipulation; transition: background .15s, border-color .15s, transform .05s; }
button:hover { background: #28303c; border-color: #46506060; }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: #1a0f05; border-color: var(--accent); font-weight: 600; }
button.primary:hover { background: var(--accent-2); }
button.accent { border-color: var(--accent); color: var(--accent-2); }
button.ghost { background: transparent; }
button.big { min-height: 46px; padding: 10px 18px; font-size: 15px; }
button[disabled] { opacity: .45; cursor: not-allowed; }
input[type="number"], input[type="text"], select {
  font-family: var(--font-body); font-size: 15px; color: var(--text); background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; min-height: 40px; font-variant-numeric: tabular-nums lining-nums;
}
input[type="number"]:focus, input[type="text"]:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; background: transparent; margin: 0; touch-action: pan-y; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--pct, 0%), var(--line-2) var(--pct, 0%)); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line-2); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: #f3f0ea; border: 3px solid var(--accent); box-shadow: 0 2px 8px #0008; }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #f3f0ea; border: 3px solid var(--accent); }
.num { font-variant-numeric: tabular-nums lining-nums; }
.hidden { display: none !important; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: auto 1fr; grid-template-areas: "brand name" "tabs tabs"; gap: var(--space-2) var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); background: #0f1115ee; backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: calc(var(--space-2) + var(--sat)); margin-top: calc(-1 * var(--sat)); }
.brand { grid-area: brand; display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
.name-input { grid-area: name; min-width: 0; width: 100%; background: transparent; border-color: transparent; font-family: var(--font-display); font-size: 16px; }
.name-input:hover, .name-input:focus { border-color: var(--line-2); background: var(--bg-2); }
.tabs { grid-area: tabs; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--bg-2); padding: 4px; border-radius: 10px; }
.tab { background: transparent; border: none; min-height: 38px; color: var(--text-2); font-weight: 600; border-radius: 7px; }
.tab.active { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
main { padding: var(--space-3); padding-bottom: calc(var(--space-6) + var(--sab)); max-width: 1500px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); }

/* Build */
.build-layout { display: grid; grid-template-columns: 1fr; gap: var(--space-3); }
.build-centre { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.viewport { background: radial-gradient(ellipse at 50% 40%, #232833 0%, #13161c 60%, #0d0f13 100%); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.viewport svg { display: block; width: 100%; height: auto; max-height: 540px; }
.part { transform-box: fill-box; transform-origin: center; transition: opacity .3s; }
.part.pop { animation: pop .38s cubic-bezier(.2,.9,.3,1.3); }
.part.flash { animation: flash .9s ease-out; }
.part.fade { opacity: 0; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes flash { 0% { filter: drop-shadow(0 0 14px #ff8a3d) brightness(1.5); } 100% { filter: none; } }
.asm-label { fill: #a7adb8; font: 13px var(--font-body, "IBM Plex Sans", sans-serif); }
.asm-caption { fill: #e6e8ec; font: 600 15px var(--font-display, "IBM Plex Sans", sans-serif); }
.stats-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.stats-strip .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; text-align: center; min-width: 0; }
.stats-strip .stat b { display: block; font-family: var(--font-display); font-size: 18px; line-height: 1.1; }
.stats-strip .stat span { display: block; color: var(--text-3); font-size: 11px; line-height: 1.2; overflow-wrap: anywhere; }
.stats-strip .stat.warn b { color: var(--warn, #ffb347); }
.stats-strip .stat.bad b { color: var(--danger); }
.build-options { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; }
.group-head { padding: var(--space-4) var(--space-4) var(--space-2); border-bottom: 1px solid var(--line); }
.group-head h2 { font-size: 18px; }
.group-head small { color: var(--text-3); }
.group-foot { display: flex; gap: 8px; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line); }
.group-foot button { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-section { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); padding: 8px 4px 2px; }
.int-row { display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: start; }
.int-row input { width: 100%; text-align: right; }
.picker { display: flex; flex-direction: column; gap: 6px; }
.picker input[type="search"] { width: 100%; font-size: 13px; }
.picker select { width: 100%; }
.custom-box { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px; }
.custom-row { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-3); }
.custom-row input, .custom-row select { width: 100%; }
.custom-box small { grid-column: 1 / -1; }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.build-nav { display: flex; flex-direction: column; gap: var(--space-3); }
.preset-row { display: flex; flex-direction: column; gap: 4px; }
.preset-row label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); }
.group-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.group-nav::-webkit-scrollbar { display: none; }
.group-nav button { white-space: nowrap; font-size: 13px; min-height: 36px; padding: 6px 12px; }
.group-nav button.active { border-color: var(--accent); color: var(--accent-2); }
.nav-actions { display: flex; gap: 8px; }
.nav-actions button { flex: 1; }
.build-form { display: flex; flex-direction: column; padding: var(--space-3) var(--space-4); }
.group { padding: 0; }
.group .fields { display: grid; grid-template-columns: 1fr; gap: var(--space-4); }
.group header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--space-3); }
.group header h2 { font-size: 18px; }
.group header small { max-width: 60%; text-align: right; }
.fields { display: grid; grid-template-columns: 1fr; gap: var(--space-4); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.wide { grid-column: 1 / -1; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.field-head label { font-weight: 600; font-size: 14px; }
.field-head .unit { color: var(--text-3); font-size: 12px; }
.range-row { display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; }
.range-row input[type="number"] { width: 100%; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; min-height: 36px; color: var(--text-2); }
.chip.active { background: #2a2016; border-color: var(--accent); color: var(--accent-2); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
.note { color: var(--text-3); font-size: 12.5px; min-height: 1.2em; }

/* Summary */
.summary { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.summary .headline { font-family: var(--font-display); font-size: 15px; color: var(--text-2); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--bg-2); border-radius: 8px; padding: 8px 10px; }
.kpi .v { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--text); line-height: 1.1; }
.kpi .v.accent { color: var(--accent); }
.kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin-top: 2px; }
.spark { width: 100%; height: 100px; display: block; }
.warnings { display: flex; flex-direction: column; gap: 6px; }
.warning { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: #2a2416; border-left: 3px solid var(--warn); color: #f3e4b8; }
.warning.bad { background: #2c1a1a; border-left-color: var(--danger); color: #f5c7c7; }
.weak { font-size: 13px; color: var(--text-2); }
.weak b { color: var(--text); }
.summary-actions { display: flex; gap: 8px; }
.summary-actions button { flex: 1; }

/* Bench */
.bench-layout { display: grid; grid-template-columns: 1fr; gap: var(--space-3); }
.bench-main { display: flex; flex-direction: column; gap: var(--space-3); }
.stage { position: relative; background: radial-gradient(ellipse at 50% 40%, #1c2129 0%, #0f1115 75%); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 10; max-height: 440px; }
#engineCanvas { width: 100%; height: 100%; display: block; }
.fail-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: var(--space-4); background: #1a0b0bd9; backdrop-filter: blur(2px); }
.fail-overlay .box { max-width: 520px; background: #241012; border: 1px solid var(--danger); border-radius: 10px; padding: var(--space-4); }
.fail-overlay h2 { color: var(--danger); font-size: 22px; margin-bottom: 6px; }
.fail-overlay p { margin: 6px 0; color: #f4d6d6; font-size: 14px; }
.gauges { display: grid; grid-template-columns: 1fr; gap: var(--space-3); }
.tach { width: 100%; height: 190px; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.tile .v { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin-top: 2px; }
.tile.warn .v { color: var(--warn); }
.tile.bad .v { color: var(--danger); }
.controls { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row button { flex: 1 1 auto; }
.ctrl label { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
.ctrl output { font-family: var(--font-display); color: var(--accent-2); }
.ctrl.inline { display: flex; align-items: center; gap: 10px; }
.ctrl.inline label { gap: 8px; align-items: center; }
.ctrl.inline input[type="number"] { width: 110px; }
.ctrl small { margin-top: 2px; }
button.on { border-color: var(--ok); color: var(--ok); }
.bench-side { display: flex; flex-direction: column; gap: var(--space-2); }
.health { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--space-3); }
.hrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.hrow .name { font-weight: 600; }
.hrow .sub { color: var(--text-3); font-size: 12px; grid-column: 1 / -1; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ok); border-radius: 3px; }
.bar i.load { background: #3d4654; }
.bar i.dmg { background: var(--danger); }
.pct { font-family: var(--font-display); font-size: 13px; color: var(--text-2); }
.pct.warn { color: var(--warn); } .pct.bad { color: var(--danger); }
.log { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; font-size: 13px; }
.log div { padding: 6px 10px; border-radius: 6px; background: var(--panel); border-left: 3px solid var(--line-2); }
.log .warn { border-left-color: var(--warn); } .log .fail { border-left-color: var(--danger); background: #2c1a1a; } .log .ok { border-left-color: var(--ok); }
.log time { color: var(--text-3); margin-right: 6px; font-variant-numeric: tabular-nums; }

/* Dyno */
.dyno-layout { display: grid; grid-template-columns: 1fr; gap: var(--space-3); }
.dyno-controls { display: flex; flex-direction: column; gap: var(--space-3); }
.chart-card { position: relative; padding: var(--space-2); }
#dynoCanvas { width: 100%; height: 360px; display: block; touch-action: pan-y; }
.hover-readout { position: absolute; top: 10px; right: 12px; font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; background: #0f1115cc; padding: 4px 8px; border-radius: 6px; pointer-events: none; }
.results .big-nums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: var(--space-3); }
.results .big-nums .kpi .v { font-size: 26px; white-space: nowrap; }
.results p { margin: 6px 0; font-size: 14px; }
.report { padding: 10px 12px; border-radius: 8px; background: var(--bg-2); border-left: 3px solid var(--ok); font-size: 14px; }
.report.bad { border-left-color: var(--danger); background: #2c1a1a; }
.report.warn { border-left-color: var(--warn); }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--text-3); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
td:first-child, th:first-child { text-align: left; }
.table-wrap { overflow-x: auto; }

/* Export */
.export-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-3); }
.export-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); display: flex; flex-direction: column; gap: 10px; }
.export-card h2 { font-size: 17px; }
.export-card p { margin: 0; font-size: 14px; color: var(--text-2); }
.export-card ol { margin: 0; padding-left: 20px; font-size: 14px; color: var(--text-2); }
.export-card ol li { margin: 3px 0; }
.export-card .btn-row button { flex: 1 1 160px; }
.export-card textarea { width: 100%; min-height: 120px; background: var(--bg-2); color: var(--text-2); border: 1px solid var(--line-2); border-radius: 8px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 8px; resize: vertical; }
.export-card select { width: 100%; }
.pill { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; background: var(--bg-2); color: var(--text-2); border: 1px solid var(--line-2); align-self: flex-start; }
.pill.ok { color: var(--ok); border-color: #2d5a3c; }
.pill.warn { color: var(--warn); border-color: #5a4b2d; }

.toast { position: fixed; left: 50%; bottom: calc(20px + var(--sab)); transform: translateX(-50%); background: #262c36; color: var(--text); border: 1px solid var(--line-2); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; box-shadow: 0 6px 24px #000a; max-width: 90vw; }

@media (min-width: 720px) {
  .topbar { grid-template-columns: auto 1fr auto; grid-template-areas: "brand name tabs"; }
  .tabs { grid-template-columns: repeat(5, auto); }
  .tab { padding: 0 18px; }
  .fields { grid-template-columns: 1fr 1fr; }
  .tiles { grid-template-columns: repeat(5, 1fr); }
  .gauges { grid-template-columns: 300px 1fr; }
  .results .big-nums { grid-template-columns: repeat(4, 1fr); }
  .export-grid { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 1100px) {
  main { padding: var(--space-4) var(--space-5); }
  .build-layout { grid-template-columns: 220px minmax(0, 1fr) 400px; align-items: start; }
  .build-nav { position: sticky; top: 76px; }
  .group-nav { flex-direction: column; overflow: visible; }
  .group-nav button { text-align: left; }
  .build-options { position: sticky; top: 76px; max-height: calc(100vh - 92px); }
  .build-form { overflow-y: auto; flex: 1; }
  .bench-layout { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
  .dyno-layout { grid-template-columns: 300px minmax(0, 1fr); grid-template-areas: "ctrl chart" "results results" "table table"; align-items: start; }
  .results { display: grid; grid-template-columns: 320px 1fr; gap: 0 var(--space-4); }
  .results .big-nums { grid-column: 1; grid-row: 1 / span 6; align-content: start; }
  .results > :not(.big-nums) { grid-column: 2; }
  .dyno-controls { grid-area: ctrl; }
  .chart-card { grid-area: chart; }
  .results { grid-area: results; }
  #dynoTable { grid-area: table; }
  #dynoCanvas { height: 440px; }
  .export-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* additions */
.hint { color: var(--text-3); font-size: 13px; }
.fail-overlay .hint { color: #f0c9a8; }
.fail-overlay .btn-row { margin-top: 10px; }
td .warn { color: var(--warn); }
button.active { border-color: var(--accent); color: var(--accent-2); background: #2a2016; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; background: var(--bg-2); padding: 1px 5px; border-radius: 4px; }
.export-card ol li b { color: var(--text); }
.build-layout > *, .dyno-layout > *, .bench-layout > *, .export-grid > *, .bench-main > *, .gauges > * { min-width: 0; }
.build-nav, .group-nav, .dyno-controls, .ctrl { min-width: 0; max-width: 100%; }
.ctrl label { min-width: 0; }
@media (max-width: 719px) {
  .tab { font-size: 13.5px; padding: 0 2px; }
  .gauges { display: contents; }
  .stage { order: 0; } .tach { order: 1; height: 170px; } .controls { order: 2; } .tiles { order: 3; }
  .stage { aspect-ratio: 16 / 9; }
}

.mini-bar { position: fixed; left: 50%; bottom: calc(12px + var(--sab)); transform: translateX(-50%); display: none; width: min(92vw, 420px); gap: 10px; align-items: center; justify-content: space-between; background: #1f242dee; backdrop-filter: blur(8px); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 14px; z-index: 30; font-size: 13px; color: var(--text-2); text-align: left; box-shadow: 0 6px 24px #000a; }
.mini-bar b { font-family: var(--font-display); font-size: 18px; color: var(--accent); }
.mini-bar .m2 { font-family: var(--font-display); font-size: 16px; color: var(--text); }
.mini-bar .arrow { color: var(--text-3); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.mini-bar.bad .arrow { color: var(--danger); }
@media (max-width: 1099px) { body[data-tab="build"] .mini-bar { display: flex; } #tab-build { padding-bottom: 70px; }
  .viewport { position: sticky; top: var(--sticky-top, 108px); z-index: 5; height: 190px; }
  .viewport svg { height: 100%; width: 100%; }
  .stats-strip { grid-template-columns: repeat(3, 1fr); }
  .stats-strip .stat b { font-size: 16px; }
  .build-layout { display: flex; flex-direction: column; }
  .build-centre { display: contents; }
  .build-nav { order: 0; } .viewport { order: 1; } .build-options { order: 2; } .stats-strip { order: 3; } .build-centre .summary { order: 4; }
  .group-nav .nav-section { display: none; }
}

</style>

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 9h3V6h5V4h2v2h5v3h3v6h-3v3h-5v2h-2v-2H6v-3H3zm5-1v8h8V8zm2 2h4v4h-4z"/></svg>
      <span>Engine Forge</span>
    </div>
    <input id="engineName" class="name-input" type="text" value="My Engine" aria-label="Engine name" maxlength="40" />
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="build" role="tab">Build</button>
      <button class="tab" data-tab="bench" role="tab">Test Bench</button>
      <button class="tab" data-tab="dyno" role="tab">Dyno</button>
      <button class="tab" data-tab="export" role="tab">Export</button>
    </nav>
  </header>

  <main>
    <!-- BUILD -->
    <section id="tab-build" class="panel active">
      <div class="build-layout">
        <aside class="build-nav">
          <div class="preset-row">
            <label for="presetSelect">Start from</label>
            <select id="presetSelect"></select>
          </div>
          <nav id="groupNav" class="group-nav" aria-label="Build steps"></nav>
          <div class="nav-actions">
            <button id="btnSave" class="ghost">Save file</button>
            <button id="btnLoad" class="ghost">Load file</button>
            <input id="fileLoad" type="file" accept=".json,application/json" hidden />
          </div>
        </aside>
        <div class="build-centre">
          <div class="viewport"><svg id="assemblySvg" role="img" aria-label="Engine assembly view"></svg></div>
          <div id="statsStrip" class="stats-strip"></div>
          <aside class="summary" id="summary"></aside>
        </div>
        <div class="build-options">
          <header id="groupHead" class="group-head"></header>
          <div id="buildForm" class="build-form"></div>
          <footer class="group-foot"><button id="grpPrev" class="ghost">‹</button><button id="grpNext" class="primary">›</button></footer>
        </div>
      </div>
    </section>

    <!-- BENCH -->
    <section id="tab-bench" class="panel">
      <div class="bench-layout">
        <div class="bench-main">
          <div class="stage">
            <canvas id="engineCanvas"></canvas>
            <div id="failOverlay" class="fail-overlay hidden"></div>
          </div>
          <div class="gauges">
            <canvas id="tachCanvas" class="tach"></canvas>
            <div class="tiles" id="tiles"></div>
          </div>
          <div class="controls">
            <div class="btn-row">
              <button id="btnStart" class="primary big">Start</button>
              <button id="btnStop" class="big">Stop</button>
              <button id="btnWot" class="big accent">Hold WOT</button>
              <button id="btnWarm" class="big ghost">Warm to 90 °C</button>
              <button id="btnRebuild" class="big ghost">Rebuild engine</button>
              <button id="btnSound" class="big ghost" aria-pressed="false">Sound: off</button>
            </div>
            <div class="ctrl">
              <label>Throttle <output id="throttleOut">0%</output></label>
              <input id="throttle" type="range" min="0" max="100" value="0" step="1" />
            </div>
            <div class="ctrl">
              <label>Dyno brake load <output id="loadOut">0%</output></label>
              <input id="load" type="range" min="0" max="100" value="0" step="1" />
            </div>
            <div class="ctrl inline">
              <label><input id="holdToggle" type="checkbox" /> Hold rpm at</label>
              <input id="holdRpm" type="number" min="800" max="22000" step="100" value="4000" inputmode="numeric" />
            </div>
          </div>
        </div>
        <aside class="bench-side">
          <h3>Component health</h3>
          <div id="health" class="health"></div>
          <h3>Log</h3>
          <div id="eventLog" class="log"></div>
        </aside>
      </div>
    </section>

    <!-- DYNO -->
    <section id="tab-dyno" class="panel">
      <div class="dyno-layout">
        <div class="dyno-controls card">
          <div class="ctrl">
            <label>Sweep rate <output id="rampOut">400 rpm/s</output></label>
            <input id="ramp" type="range" min="100" max="2000" step="50" value="400" />
            <small>Slow sweeps heat-soak the engine and accumulate more fatigue, like a long pull on a brake dyno.</small>
          </div>
          <div class="ctrl">
            <label>Coolant at start <output id="dynoTempOut">90 °C</output></label>
            <input id="dynoTemp" type="range" min="40" max="115" step="1" value="90" />
          </div>
          <div class="btn-row">
            <button id="btnDyno" class="primary big">Run dyno pull</button>
            <button id="btnDynoDestruct" class="big">Run to destruction</button>
            <button id="btnDynoKeep" class="big ghost">Keep as comparison</button>
          </div>
        </div>
        <div class="card chart-card">
          <canvas id="dynoCanvas"></canvas>
          <div id="dynoHover" class="hover-readout"></div>
        </div>
        <div id="dynoResults" class="card results"></div>
        <div id="dynoTable" class="card"></div>
      </div>
    </section>

    <!-- EXPORT -->
    <section id="tab-export" class="panel">
      <div class="export-grid" id="exportGrid"></div>
    </section>
  </main>

  <button id="miniBar" class="mini-bar" aria-label="Show estimate"></button>
  <div id="toast" class="toast hidden"></div>

function isRotary(spec) { return byId(LAYOUTS, spec.layout).rotary === true; }
function isOpposed(spec) { return byId(LAYOUTS, spec.layout).opposed === true || spec.cycle === "1s"; }
function isTwoStroke(spec) { return spec.cycle === "2s" || spec.cycle === "1s" || isOpposed(spec); }
function isCI(spec) { return spec.ignition === "ci"; }
function isTurbo(spec) { return byId(ASPIRATION, spec.aspiration).kind === "turbo"; }
function isSC(spec) { return ["pd", "dyn", "wave", "elec"].includes(byId(ASPIRATION, spec.aspiration).kind); }
function scavenge(spec) { if (isOpposed(spec)) return byId(SCAVENGING, "op"); return byId(SCAVENGING, spec.scavenging); }
function noHead(spec) { return isRotary(spec) || isOpposed(spec); }
function isAxial(spec) { return byId(LAYOUTS, spec.layout).axial === true; }
function isEV(spec) { const h = byId(HYBRIDS, spec.hybrid); return !!h && h.path === "ev"; }
function hasValvetrain(spec) {
  if (isRotary(spec) || isOpposed(spec) || isAxial(spec)) return false;
  if (isTwoStroke(spec)) return scavenge(spec).head === true;
  return true;
}
function strokes(spec) { return byId(CYCLES, spec.cycle).strokes; }

// Balance quality 0-1 (1 = perfect primary & secondary balance) by layout and count.
function balanceFactor(spec, n) {
  const L = byId(LAYOUTS, spec.layout);
  const bankAngle = spec.bankAngle;
  if (L.rotary) return 0.95;
  if (L.opposed) return 0.95;
  if (L.radial) { const per = Math.ceil(n / Math.max(1, spec.rows || 1)); return per % 2 === 1 ? 0.85 : 0.65; }
  if (spec.layout === "I") return n >= 6 ? (n % 2 === 0 ? 1.0 : 0.85) : ({ 1: 0.30, 2: 0.45, 3: 0.75, 4: 0.72, 5: 0.80 })[n] ?? 0.7;
  if (spec.layout === "B") return n >= 6 ? 1.0 : ({ 2: 0.70, 4: 0.90 })[n] ?? 0.9;
  if (spec.layout === "F") return n >= 12 ? 1.0 : 0.85;
  if (spec.layout === "VR") return n === 6 ? 0.80 : 0.70;
  if (spec.layout === "W" || spec.layout === "X" || spec.layout === "H") return n >= 12 ? 0.95 : 0.85;
  if (spec.layout === "W3") return n >= 9 ? 0.9 : 0.6;
  if (spec.layout === "U" || spec.layout === "SQ") return 0.85;
  // V engines: best angle = 720 / n (or 1440/n) for even firing.
  const ideal = 720 / n;
  const off = Math.abs(((bankAngle - ideal) % 360));
  const err = Math.min(off, 360 - off, Math.abs(bankAngle - 2 * ideal)) / 90;
  let base = n >= 12 ? 1.0 : ({ 2: 0.55, 4: 0.60, 6: 0.78, 8: 0.90, 10: 0.80 })[n] ?? 0.8;
  if (n === 8 && Math.abs(bankAngle - 90) < 1) base = 0.92;
  return Math.max(0.3, base - 0.25 * Math.min(1, err));
}

    intervals: fi.intervals, cycleDeg: fi.cycleDeg, basis: fi.basis,
    intakeHz: 343 / (4 * Math.max(80, spec.runner) / 1000),
    exhHz: 520 / (4 * hdrLen / 1000),
    itb: spec.intake === "itb" || spec.intake === "wacpipe",
    plenumFactor: spec.intake === "wacpipe" ? Math.min(1.5, Math.max(0.6, (spec.plenumD || 114.3) / 114.3)) : 1,
    bright: 1 - 0.6 * (exh ? exh.bp : 0.5),
    turbo: A.kind === "turbo", scMul, scOn: scMul > 0,
  };
}

// Length of one row of bores (bore surfaces + the specified gap between neighbours), mm. Null if gap not specified.
function cylinderRowLength(spec, g) {
  if (!(spec.boreGap > 0) || g.rotary || !g.banks) return null;
  const perBank = Math.ceil(g.n / g.banks.length);
  return perBank * spec.bore + (perBank - 1) * spec.boreGap;
}

const FUEL_DENSITY = { m100: 0.792, e100: 0.789, e85: 0.78, diesel2: 0.83, diesel1: 0.82 };   // kg/L
// Static injector sizing at peak fuel demand (80 % max duty). Only evaluated when rated flows are entered.
function injectorChecks(spec, g, sweep) {
  const out = [];
  if (g.ev || g.rotary || !(spec.diInjCc > 0 || spec.portInjCc > 0)) return out;
  const dens = FUEL_DENSITY[g.fuel.id] || (g.fuel.group && g.fuel.group.startsWith("Petroleum") ? 0.74 : 0);
  if (!dens || g.fuel.phase !== "liquid") { out.push("Injector sizing not evaluated for this fuel (no density data)."); return out; }
  const peak = Math.max(...sweep.pts.map((p) => p.fuelFlow || 0));      // kg/s
  const ccMin = peak / dens * 1000 * 60;                                 // kg/s ÷ kg/L × 1000 cc/L × 60 s/min
  const dual = spec.injection === "dipfi";
  const share = dual ? spec.diSplit / 100 : (spec.injection === "di" ? 1 : 0);
  const need = (frac, rated, label) => {
    if (!(rated > 0) || frac <= 0) return;
    const per = ccMin * frac / g.n, cap = rated * 0.8;
    if (per > cap) out.push(`${label} injectors: ${Math.round(per)} cc/min per cylinder needed at peak, but only ${Math.round(cap)} cc/min is usable (${rated} cc/min rated at 80 % duty) — the engine runs lean at the top.`);
    else out.push(`${label} injectors: ${Math.round(per)} cc/min per cylinder needed at peak against ${Math.round(cap)} usable — OK.`);
  };
  need(dual ? share : (share === 1 ? 1 : 0), spec.diInjCc, "Direct");
  need(dual ? 1 - share : (share === 0 ? 1 : 0), spec.portInjCc, "Port");
  return out;
}

// ---------------------------------------------------------------------------
// Forced induction
// ---------------------------------------------------------------------------
function induction(spec, g, rpm, throttle, airflowNA) {
  const A = g.asp;
  const asp = spec.aspiration;
  const ic = C.byId(C.INTERCOOLERS, spec.intercooler);
  const out = { boost_pa: 0, t_charge: T_AMB, p_exh: P_ATM, drive_kw: 0, turbo_rpm_frac: 0, surge: false, choke: false, eff: 0, spoolRpm: 0, flowRatio: 0, eKw: 0 };
  const blowerOnly = A.kind === "na" && g.twoStroke && C.scavenge(spec).blower;
  if (A.kind === "na" && !blowerOnly) {
    out.t_charge = T_AMB + 12;
    if (A.ram) out.boost_pa = 0.035e5 * clamp(rpm / spec.revLimit, 0, 1) ** 2;   // tuned-plenum + scoop pressure at speed
    return out;
  }
  if (blowerOnly) {
    const pr = 1.25;
    out.boost_pa = 0.2e5;
    const t2 = T_AMB * (1 + (pr ** 0.2857 - 1) / 0.6);
    out.t_charge = t2 - ic.eff * (t2 - T_AMB) + 8;
    out.drive_kw = airflowNA * 1.5 * 1005 * (t2 - T_AMB) / 1000 / 0.95;
    return out;
  }

  let target = spec.boost * PSI * (g.ci ? 1 : throttle ** 2);
  if (A.prMax) target = Math.min(target, (A.prMax - 1) * P_ATM);
  const d = spec.turboSize;
  let mMax = 0.000125 * d * d * (A.units || 1);
  if (A.flowCap) mMax = Math.min(mMax, A.flowCap);
  const prTarget = (P_ATM + Math.min(spec.boost * PSI, A.prMax ? (A.prMax - 1) * P_ATM : Infinity)) / P_ATM;
  const mReq = airflowNA * prTarget;
  const ratio = A.kind === "turbo" || A.kind === "wave" || A.flowCap ? mReq / mMax : 0;

  let boost = target;
  let eff = 0.74 + (A.effBonus || 0);
  let spoolRpm = 0;
  if (A.kind === "turbo") {
    const mPerRpm = g.vd_eq_cc * 1e-6 / 120 * 1.18 * 0.9;
    spoolRpm = 0.32 * mMax / (mPerRpm * Math.sqrt(prTarget)) * (A.spool || 1);
    const R = mMax / (mPerRpm * 6000);
    const start = spoolRpm * 0.5;
    const f = clamp((rpm - start) / (spoolRpm - start), 0, 1);
    let avail = f ** 1.6;
    if (A.twinch) avail = Math.max(avail, rpm < 4500 ? 1 : 0);
    if (A.minAvail) avail = Math.max(avail, A.minAvail);
    boost = target * avail;
    out.turbo_rpm_frac = Math.max(f, boost > 0 ? 0.3 : 0);
    if (ratio > 1) { boost *= (1 / ratio) ** 2.5; out.choke = true; }
    if (ratio > 0.85) eff -= (ratio - 0.85) * 0.8;
    if (ratio < 0.25 && boost > 0) { eff -= 0.1; out.surge = true; }
    const turbineFactor = (1.75 - 0.75 * clamp(R / 4, 0, 1)) * (A.bp || 1);
    out.p_exh = P_ATM + boost * turbineFactor;
    if (A.eKw && avail > f ** 1.6) out.eKw = A.eKw * clamp(1 - f, 0, 1);
    if (A.regen && f >= 1) out.eKw = -Math.min(A.eKw, boost / 1e5 * airflowNA * 60);   // MGU-H harvesting
  } else if (A.kind === "pd") {
    boost = target * clamp(rpm / A.fullRpm, 0.3, 1);
    eff = A.eff;
    if (ratio > 1) { boost *= (1 / ratio) ** 2; out.choke = true; }
  } else if (A.kind === "dyn") {
    boost = target * clamp(rpm / spec.revLimit, 0, 1) ** A.exp;
    eff = A.eff;
  } else if (A.kind === "wave") {
    boost = target * clamp((rpm - 800) / A.fullRpm, 0, 1);
    eff = A.eff;
    if (ratio > 1) { boost *= (1 / ratio) ** 2; out.choke = true; }
    out.p_exh = P_ATM + boost * A.bp;
  } else if (A.kind === "elec") {
    boost = target;
    eff = A.eff;
    out.eKw = A.eKw * clamp(boost / (0.5e5), 0, 1);
  }
  out.eff = clamp(eff, 0.4, 0.82);
  const pr = (P_ATM + boost) / P_ATM;
  const t2 = T_AMB * (1 + (pr ** 0.2857 - 1) / out.eff) + (A.heat || 0);
  let t3 = t2 - ic.eff * (t2 - T_AMB) - (ic.sub_ambient || 0);
  if (C.byId(C.COOLING, spec.cooling).id === "water") t3 -= 12 * clamp(boost / (10 * PSI), 0, 1);
  out.t_charge = Math.max(T_AMB - 45, t3) + 8;
  out.boost_pa = Math.max(0, boost - ic.dp * PSI * (airflowNA / 0.2) ** 2 * 0.3) + (ic.o2bonus || 0) * P_ATM * clamp(throttle, 0, 1);
  if (A.kind === "pd" || A.kind === "dyn" || A.kind === "wave" || A.twinch || A.eShare) {
    const m = airflowNA * pr;
    const scShare = A.twinch ? clamp(1 - rpm / 4500, 0, 1) : A.eShare ? A.eShare : 1;
    out.drive_kw = m * 1005 * (t2 - T_AMB) / 1000 * scShare / 0.95 * (A.kind === "wave" ? 0.25 : 1);
  }
  if (out.eKw > 0 && (spec.hybrid === "none" || (spec.voltage || 48) < 48)) out.drive_kw += out.eKw / 0.6;   // alternator has to make it
  out.spoolRpm = spoolRpm;
  out.flowRatio = ratio;
  return out;
}

// ---------------------------------------------------------------------------
// Burn duration & MBT
// ---------------------------------------------------------------------------
function combustionGeometry(spec, g, rpm, boostPa) {
  const cgi = combustionGeometryInner(spec, g, rpm, boostPa);
  if (g.lateBurn) { cgi.burn *= 0.6; cgi.mbt -= 12; }
  if (g.split) { cgi.mbt -= 6; }
  return cgi;
}
function combustionGeometryInner(spec, g, rpm, boostPa) {
  let burn, mbt;
  const fuel = g.fuel;
  if (g.rotary) { burn = 55; mbt = 24 + rpm / 1000 * 1.0; }
  else if (g.ci) {
    const inj = C.byId(C.INJECTION, spec.injection);
    const msBurn = 2.0 + 1500 / (inj.pinj || 800);                 // mixing-controlled burn, ms
    burn = msBurn * rpm * 0.006 + 12;
    mbt = 4 + rpm / 1000 * 2.5;                                      // start of injection advance
  } else {
    burn = spec.valves >= 4 ? 30 : 36;
    if (g.twoStroke) burn = 34;
    burn *= (spec.bore / 86) ** 0.25;
    burn *= 1 + 0.03 * (rpm / 1000 - 3);
    burn *= 1 - 0.12 * clamp(boostPa / (15 * PSI), 0, 1.5);
    burn *= clamp(1 - 0.015 * (spec.cr - 10), 0.85, 1.1);
    burn *= fuel.flame || 1;
    if (g.twoStroke) burn *= 1.15;                                   // residual-diluted charge burns slower
    mbt = burn * 0.75 - 3;
  }
  return { burn, mbt };
}

// ---------------------------------------------------------------------------
// One steady operating point
// ---------------------------------------------------------------------------
function operatingPoint(spec, g, rpm, throttle = 1, state = null) {
  if (g.ev) return evPoint(spec, g, rpm, throttle, state);
  const fuel = g.fuel;
  const inj = C.byId(C.INJECTION, spec.injection);
  const header = C.byId(C.HEADERS, spec.header);
  const exhaust = C.byId(C.EXHAUSTS, spec.exhaust);
  const oiling = C.byId(C.OILING, spec.oiling);
  const bearingType = C.byId(C.BEARING_TYPES, spec.bearingType);
  const headFast = C.byId(C.HEAD_FASTENERS, spec.headFast);
  const vt = C.byId(C.VALVETRAINS, spec.valvetrain);
  const cooling = C.byId(C.COOLING, spec.cooling);
  const tCool = state?.tCoolant ?? 363;
  const tOil = state?.tOil ?? 373;
  const ci = g.ci, hcci = spec.ignition === "hcci";
  const twoStroke = g.twoStroke;
  const strokes = g.strokes;
  const sixStroke = strokes === 6;

  rpm = Math.max(200, rpm);
  const br = breathing(spec, g, rpm);
  const revs = rpm / 60;
  const vd = g.rotary ? g.vd_eq_cc * 1e-6 : g.vd_cc * 1e-6;        // swept volume per full set of cylinders
  const cyclesPerRev = g.rotary ? 0.5 : 2 / strokes;                 // engine cycles per revolution

  // Load control: throttle plate for SI, fuel quantity for CI (HCCI: unthrottled lean until full load)
  const idleFrac = 0.28;

  const airflowNA = vd * revs * cyclesPerRev * 1.18 * br.ve;

  const evapCool = 8 * (fuel.cooling - 1) * (inj.charge_cool || 1) * 2.0 * (fuel.phase === "cryo" ? 2 : 1);
  const tCharge = ind.t_charge - evapCool;

  const airflow = mAirCycle * revs * cyclesPerRev;

  // Fuel & heat release
  let lambda = clamp(spec.lambda, 0.6, 3.0);

  if (hcci) lambda = throttle > 0.85 ? Math.max(0.95, spec.lambda) : Math.max(spec.lambda, 1.6);
  const afr = fuel.stoich * lambda;
  const mFuelCycle = mAirCycle / afr;
  const phi = 1 / lambda;
  let etaComb = inj.mix;
  if (phi > 1) etaComb *= Math.max(0.3, 1 - 0.95 * (phi - 1));
  if (!ci && !hcci && phi < 0.85) etaComb *= Math.max(0.5, 1 - 2 * (0.85 - phi));
  if (hcci && phi < 0.4) etaComb *= Math.max(0.4, 1 - 2.5 * (0.4 - phi));

  const crEff = g.rotary || twoStroke ? spec.cr : spec.cr * (1 - 0.0012 * Math.max(0, spec.camDur - 200));
  const gamma = ci ? 1.35 : 1.30;

  // Pumping & friction

  let pmep = Math.max(0, pExhSys - pMan) * 0.9 + 0.08e5 + P_ATM * (1 - thrFrac) * 0.85;
  if (twoStroke) pmep = Math.max(0, pExhSys - pMan) * 0.5 + 0.15e5 * (C.scavenge(spec).blower ? 0.5 : 1);   // crankcase pumping / blower work handled separately

  const pmaxBar = res.pmax / 1e5 * (g.lateBurn ? 0.7 : 1) * (g.split ? 0.9 : 1);
  const kr = rpm / 1000;

  if (g.lateBurn) { res.imepG *= 0.97; }
  const imepN = res.imepG - pmep;
  const bmep = (imepN - fmep) * (1 - g.gearLoss);

    loads.piston = { ratio: Math.max(pmaxBar / pRating, tCrown / tLimitP), pmax: pmaxBar, limitP: pRating, tCrown, tLimit: tLimitP, unit: "bar" };
    // Liner: piston speed vs scuff limit; bare aluminium liner scuffs; Alusil needs hypereutectic
    const boreCoat = C.mat(spec, "boreCoat");
    let scuff = (boreCoat.scuff || 1) * (C.mat(spec, "skirtCoat").scuff || 1) ** 0.5;
    const linerBareAl = g.linerMat.density < 3.5 && boreCoat.id === "none";
    if (linerBareAl) scuff *= 0.5;
    if (boreCoat.needsA390 && g.linerMat.id !== "a390") scuff *= 0.6;
    if (g.linerMat.density > 3.5 && g.linerMat.density < 5 && boreCoat.id === "none") scuff *= 0.8;  // Ti/Mg liner, unlikely
    const spLimit = (23 + 7 * clamp((g.pistonTech.strength - 0.85) / 0.5, 0, 1)) * scuff * (g.linerMat.hardness ? clamp(g.linerMat.hardness / 200, 0.7, 1.3) ** 0.3 : 1);
    loads.liner = { ratio: Math.max(sp / spLimit, (tCrown - 80) / Math.max(200, g.linerMat.tmax)), value: sp, limit: spLimit, unit: "m/s" };
    // Rod bearing
    const fRot = g.m_rot_rod * g.r * omega * omega;
    const fBear = Math.max(fGas - fInertia, fInertia + fRot, fRot);
    const bearMPa = fBear / (g.d_journal * g.l_journal);
    let bearBase = (g.bearingMat.bearingLoad || Math.min(60, g.bearingMat.yield * 0.4)) * bearingType.mult;
    if (bearingType.id === "poured" && g.bearingMat.id !== "babbitt") bearBase *= 0.5;
    const bearLimit = bearBase * (tOil > 403 ? Math.max(0.5, 1 - (tOil - 403) / 60) : 1) * (oiling.id === "dry" ? 1.05 : 1) * (oiling.id === "splash" && rpm > 3000 ? Math.max(0.3, 1 - (rpm - 3000) / 3000) : 1);
    loads.bearing = { ratio: bearMPa / bearLimit, value: bearMPa, limit: bearLimit, unit: "MPa" };
    // Crank
    const tInst = 0.5 * fGas * g.r;
    const zTors = PI * (g.d_journal / 1000) ** 3 / 16;
    const perCrank = g.n * g.pistonsPerCyl / g.cranks / g.banks.length;
    const longCrank = Math.max(0, perCrank - 6) * 0.08;
    const amp = 1 + (rpm / 8000) ** 2 * (1.4 - 0.4 * g.bal) + longCrank * (rpm / 3000) ** 2;
    const crankStress = tInst / zTors / 1e6 * 2.5 * amp * (g.layout.radial ? 1.3 : 1);
    const crankLimit = g.crankMat.uts * g.crankMat.fatigue * g.crankTech.strength;
    loads.crank = { ratio: crankStress / crankLimit * (g.axial ? 1.3 : 1), value: crankStress, limit: crankLimit, unit: "MPa" };
    // Head gasket & head
    if (!C.noHead(spec)) {
      const gasketMat = C.mat(spec, "gasketMat");
      const fastMat = C.mat(spec, "fastenerMat");
      const clampQ = clamp(fastMat.yield / 900, 0.5, 1.6) ** 0.5;
      const deckQ = g.blockMat.density > 5 ? 1.0 : 0.8;
      const gasketLimit = (gasketMat.gasketLimit || 80) * headFast.clamp * clampQ * deckQ * (ci ? 1.25 : 1) * (86 / spec.bore) ** 0.5 * (tCool > 383 ? Math.max(0.6, 1 - (tCool - 383) / 50) : 1) * (tCool - 273 > gasketMat.tmax ? 0.5 : 1);
      loads.gasket = { ratio: pmaxBar / gasketLimit, value: pmaxBar, limit: gasketLimit, unit: "bar" };
      const tHead = (tCool - 273) + 110 * kwPerCm2 ** 0.8 * (150 / Math.max(5, g.headMat.k_therm)) ** 0.3 * (cooling.air ? 1.4 : 1) + knockIntensity * 40;
      const headP = 50 * Math.max(20, g.headMat.yield) ** 0.32 * (g.headMat.density > 5 ? 1 : 0.75);
      loads.head = { ratio: Math.max(tHead / g.headMat.tmax, pmaxBar / headP), value: tHead, limit: g.headMat.tmax, unit: "°C" };
    }
    // Block / cylinder wall
    const blockLimit = 45 * Math.max(20, g.blockMat.yield) ** 0.32 * (g.blockMat.density > 5 ? 1 : 0.7) * (0.8 + 0.2 * g.blockTech.strength) * (spec.bore / spec.stroke > 1.3 ? 0.92 : 1) * (g.blockMat.density < 1 ? 0.5 : 1);
    loads.block = { ratio: pmaxBar / blockLimit + knockIntensity * 0.3 + dieselKnock * 0.2, value: pmaxBar, limit: blockLimit, unit: "bar" };
    // Valvetrain
    if (g.hasVT) {
      loads.valvetrain = { ratio: rpm / br.floatRpm, value: rpm, limit: br.floatRpm, unit: "rpm" };
      const evalve = C.mat(spec, "evalveMat");
      const tValve = 0.65 * egt + 80 + (cooling.air ? 40 : 0);
      loads.valves = { ratio: tValve / evalve.tmax, value: tValve, limit: evalve.tmax, unit: "°C" };
      const camMat = C.mat(spec, "camMat");
      const camCoat = C.mat(spec, "camCoat");
      const camLoad = C.byId(C.SPRINGS, spec.spring).rate * (spec.camLift / 12) ** 1.5 * (vt.pushrod ? 1.2 : 1) * (vt.id === "hr" || vt.id === "mr" ? 0.6 : 1) * (rpm / 6000) ** 0.3 * 60;
      const camLimit = Math.max(20, camMat.hardness || 200) ** 0.5 * 4.4 * ((camCoat.scuff || 1)) * (vt.pushrod && (camMat.hardness || 0) < 250 ? 0.8 : 1);
      loads.cam = { ratio: camLoad / camLimit, value: camLoad, limit: camLimit, unit: "MPa·eq" };
      const springMat = C.mat(spec, "springMat");
      const springStress = C.byId(C.SPRINGS, spec.spring).rate * 650 * (spec.camLift / 12) * (1 + 0.3 * (rpm / br.floatRpm) ** 2);
      const springLimit = springMat.uts * springMat.fatigue * 1.9 * (tOil - 273 > springMat.tmax ? 0.6 : 1);
      loads.spring = { ratio: springStress / springLimit, value: springStress, limit: springLimit, unit: "MPa" };
    }
  } else {
    const sealLimitP = 85 * (spec.port === "periph" ? 0.95 : 1) * (g.pistonMat.density > 5 ? 1 : 0.85);
    const tipSpeed = omega / 3 * g.rotorRadius / 1000;
    loads.apex = { ratio: Math.max(pmaxBar / sealLimitP, tipSpeed / 38) + knockIntensity * 1.5, value: pmaxBar, limit: sealLimitP, tip: tipSpeed, unit: "bar" };
    const eccLoad = res.pmax * 0.0082 / (0.074 * 0.045) / 1e6;
    const bl = (g.bearingMat.bearingLoad || 60) * bearingType.mult;
    loads.bearing = { ratio: eccLoad / bl, value: eccLoad, limit: bl, unit: "MPa" };
    const housingLimit = 45 * Math.max(20, g.blockMat.yield) ** 0.32 * (g.blockMat.density > 5 ? 0.8 : 0.5);
    loads.rotorHousing = { ratio: pmaxBar / housingLimit, value: pmaxBar, limit: housingLimit, unit: "bar" };
  }
  // Common
  loads.flywheel = { ratio: rpm / g.flywheel.rpm_rating, value: rpm, limit: g.flywheel.rpm_rating, unit: "rpm" };
  const exMan = C.mat(spec, "exManMat");
  const tManMetal = 0.72 * egt + 30;
  loads.exMan = { ratio: tManMetal / (exMan.tmax * 1.12), value: tManMetal, limit: exMan.tmax * 1.12, unit: "°C" };
  const intakeMan = C.mat(spec, "intakeManMat");
  loads.intakeMan = { ratio: Math.max((tCharge - 273) / intakeMan.tmax, (pMan - P_ATM) / 1e5 / (intakeMan.yield > 100 ? 6 : intakeMan.yield > 40 ? 3.5 : 1.5)), value: tCharge - 273, limit: intakeMan.tmax, unit: "°C" };
  const seal = C.mat(spec, "sealMat");
  loads.seals = { ratio: (tOil - 273) / seal.tmax * (seal.oilIncompatible ? 1.6 : 1), value: tOil - 273, limit: seal.tmax, unit: "°C" };
  if (C.isTurbo(spec)) {
    const turbine = C.mat(spec, "turbineMat");
    loads.turbo = { ratio: Math.max((egt - 100) / (turbine.tmax * 1.1), (ind.flowRatio || 0) / 1.05), value: egt - 100, limit: turbine.tmax * 1.1, flowRatio: ind.flowRatio, unit: "°C" };
  }
  if (g.asp.wear) loads.blower = { ratio: rpm / g.asp.rpmCap + (ind.boost_pa / 1e5) * 0.4, value: rpm, limit: g.asp.rpmCap, unit: "rpm" };
  if (g.asp.kind === "wave") loads.blower = { ratio: Math.max(ind.flowRatio || 0, (egt + 273) / 1050), value: egt, limit: 780, unit: "°C" };
  if (eAssist) Object.assign(loads, eLoads(g.e, eAssist, tCool));
  loads.knock = { ratio: ci ? dieselKnock : res.ki, value: ci ? dieselKnock : res.ki, limit: 1, unit: "KI" };
  loads.coolant = { ratio: (tCool - 273) / (cooling.air ? 150 : 118), value: tCool - 273, limit: cooling.air ? 150 : 118, unit: "°C" };

  const peakRatio = Object.entries(loads).reduce((a, [k, v]) => (k !== "coolant" && k !== "knock" && v.ratio > a.r) ? { k, r: v.ratio } : a, { k: null, r: 0 });

  return {
    rpm, throttle, torque, powerKw, powerHp: powerKw * 1.34102,
    bmep: bmep / 1e5, imepG: res.imepG / 1e5, fmep: fmep / 1e5, pmep: pmep / 1e5, pmax: pmaxBar,
    ve: br.ve, machZ: br.z, map_kpa: pMan / 1000, boost_psi: ind.boost_pa / PSI, boostTarget_psi: spec.boost,
    tCharge_c: tCharge - 273, egt_c: egt, airflow, fuelFlow: mFuelCycle * revs * cyclesPerRev / shortCircuit,
    bsfc: powerKw > 0 ? mFuelCycle * revs * cyclesPerRev / shortCircuit * 3.6e6 / powerKw : Infinity,
    etaBrake: fuelPowerKw > 0 ? powerKw / (fuelPowerKw / shortCircuit) : 0,
    lambda, timing: adv, mbt: cg.mbt, retarded, ki: res.ki, knocking, knockIntensity, burn: cg.burn, dieselKnock,
    heatCoolKw, fuelPowerKw, pistonSpeed: sp, floatRpm: br.floatRpm, rpmPeakVE: br.rpm_peak,
    turbo: ind, loads, peak: peakRatio, scDriveKw: ind.drive_kw, ci, strokes, firingPerRev: g.firingPerRev,
    eKw: (eAssist ? eAssist.kwElec : 0) + (ind.eKw || 0), eNm: eAssist ? eAssist.nm * g.e.hyb.eff : 0,
  };
}

// ---------------------------------------------------------------------------
// Failure descriptions
// ---------------------------------------------------------------------------
const COMPONENT_INFO = {
  rod: { name: "Connecting rods", fail: "Rod let go. Compressive gas load exceeded ~55% of yield (buckling) or inertia exceeded the fatigue limit — there is now a window in the block." },
  camTrack: { name: "Cam track / followers", fail: "The cam-track followers hammered through their hardened surface and the pistons lost their timing." },
  pin: { name: "Wrist pins", fail: "Wrist pin bent and seized in the small end. Gas load exceeded the pin alloy's bending limit." },
  piston: { name: "Pistons", fail: "Piston failure. Either peak cylinder pressure cracked the ring lands or the crown overheated and the alloy lost its strength." },
  liner: { name: "Cylinder liners / bores", fail: "Bore scuffed and seized. Piston speed and crown heat exceeded what this liner surface can carry without welding to the skirt." },
  bearing: { name: "Rod bearings", fail: "Spun a rod bearing. Unit load exceeded the lining's capacity, the oil film collapsed and the shell welded to the journal." },
  crank: { name: "Crankshaft", fail: "Crankshaft fractured at a pin fillet from torsional fatigue. Long cranks and poor balance amplify it with the square of rpm." },
  gasket: { name: "Head gasket", fail: "Head gasket blew. Cylinder pressure lifted the head off the deck — compression went into the coolant." },
  head: { name: "Cylinder head", fail: "Cylinder head cracked between the valve seats. The head alloy ran past its temperature limit or its pressure capacity." },
  block: { name: "Block / cylinder walls", fail: "Cylinder wall cracked. Peak pressure and combustion shock exceeded what the block material can carry." },
  valvetrain: { name: "Valvetrain", fail: "Valve float turned into valve-to-piston contact. Bent valves, broken rockers." },
  valves: { name: "Exhaust valves", fail: "Exhaust valve head burned and tuliped — the valve alloy ran hotter than it can survive." },
  cam: { name: "Camshaft lobes", fail: "Cam lobes wiped. Lobe surface hardness could not carry the spring load." },
  spring: { name: "Valve springs", fail: "Valve spring fatigued and broke — the valve dropped into the cylinder." },
  flywheel: { name: "Flywheel / clutch", fail: "Flywheel burst. Over its rated speed it comes apart with the energy of a hand grenade." },
  turbo: { name: "Turbocharger", fail: "Turbo failure. Turbine inlet temperature exceeded the wheel alloy, or the compressor was driven off its map (surge/choke)." },
  exMan: { name: "Exhaust manifold", fail: "Exhaust manifold cracked / melted. Exhaust gas temperature exceeded the manifold material's limit." },
  motor: { name: "Electric motor", fail: "Motor windings overheated — insulation broke down and the stator shorted. Peak power is a seconds rating, not a continuous one." },
  inverter: { name: "Inverter / power electronics", fail: "Inverter over-current: IGBT/SiC stage failed. Current for this power at this voltage exceeded the switch rating." },
  battery: { name: "Battery / energy store", fail: "Pack over-discharged beyond its C-rate — cells overheated and the contactors opened." },
  blower: { name: "Supercharger", fail: "Supercharger failure: vanes/rotor overheated or over-sped and seized." },
  intakeMan: { name: "Intake manifold", fail: "Intake manifold failed — too hot or too much boost for the material." },
  seals: { name: "Seals", fail: "Crank/valve seals hardened and leaked. Oil temperature or oil chemistry exceeded what the elastomer tolerates." },
  apex: { name: "Apex seals", fail: "Apex seals shattered. Detonation or over-speed broke the seals and scored the rotor housings — compression lost." },
  rotorHousing: { name: "Rotor housings", fail: "Rotor housing surface flaked from heat and pressure — compression lost." },
  knock: { name: "Detonation", fail: "Uncontrolled detonation." },
  coolant: { name: "Cooling system", fail: "Severe overheating. Head warped, gasket failed, pistons expanded into the bores." },
};

function damageRate(key, ratio) {
  if (key === "knock") return 0;
  if (key === "coolant") return ratio > 1 ? (ratio - 1) * 60 : 0;
  if (ratio <= 0.85) return 0;
  if (ratio <= 1) return (ratio - 0.85) / 0.15 * 0.25;
  return 0.25 + (ratio - 1) * 18 + (ratio - 1) ** 2 * 30;
}

function knockDamage(op, g) {
  const k = op.knockIntensity + (op.dieselKnock || 0) * 0.5;
  if (k <= 0) return {};
  const base = k * 6 * (op.pmax / 60);
  if (g.rotary) return { apex: base * 2.5 };
  const pistonMult = g.pistonMat.yield < 250 ? 2.2 : 1;
  return { piston: base * pistonMult, gasket: base * 0.6, block: base * 0.35, bearing: base * 0.5, head: base * 0.3 };
}

// ---------------------------------------------------------------------------
// Dyno sweep
// ---------------------------------------------------------------------------
function rpmCap(spec, g) {
  const inj = C.byId(C.INJECTION, spec.injection);
  let cap = Infinity;
  if (g.ci && inj.rpmCap) cap = Math.min(cap, inj.rpmCap);
  if (g.fuel.maxRpmHint) cap = Math.min(cap, g.fuel.maxRpmHint);
  if (g.ev) cap = Math.min(cap, g.e.motor.maxRpm);
  return cap;
}

function dynoSweep(spec, opts = {}) {
  const g = geometry(spec);
  const step = opts.step || 100;
  const rampRpmPerSec = opts.ramp || 400;
  const startRpm = opts.start || Math.min(1000, Math.max(300, Math.round(spec.revLimit * 0.15 / 50) * 50));
  const endRpm = opts.end || Math.min(spec.revLimit, rpmCap(spec, g));
  const state = { tCoolant: opts.tCoolant || 363, tOil: opts.tOil || 373 };
  const damage = {};
  const pts = [];
  let failure = null;
  let worst = { ratio: 0, key: null, rpm: 0 };
  const dt = step / rampRpmPerSec;
  state.t = 0;
  for (let rpm = startRpm; rpm <= endRpm + 1e-6; rpm += step) {
    const op = operatingPoint(spec, g, rpm, 1, state);
    pts.push(op);
    state.t += dt;
    state.tCoolant += (op.heatCoolKw - coolingCapacityKw(spec, g, state.tCoolant, rpm, state.t)) / thermalMassKjK(g) * dt;
    state.tOil = lerp(state.tOil, state.tCoolant + 12 + op.powerKw / 40, 0.15 * dt);
    const kd = knockDamage(op, g);
    for (const [k, l] of Object.entries(op.loads)) {
      if (l.ratio > worst.ratio && k !== "knock" && k !== "coolant") worst = { ratio: l.ratio, key: k, rpm };
      const rate = damageRate(k, l.ratio) + (kd[k] || 0);
      if (!rate) continue;
      damage[k] = (damage[k] || 0) + rate * dt;
      if (damage[k] >= 100 && !failure && k !== "knock") failure = { key: k, rpm, op, ...COMPONENT_INFO[k] };
    }
    if (failure && !opts.ignoreFailure) break;
  }
  if (!pts.length) pts.push(operatingPoint(spec, g, startRpm, 1, state));
  const peakT = pts.reduce((a, p) => p.torque > a.torque ? p : a, pts[0]);
  const peakP = pts.reduce((a, p) => p.powerKw > a.powerKw ? p : a, pts[0]);
  const knockRange = pts.filter((p) => p.knocking).map((p) => p.rpm);
  return { g, pts, peakT, peakP, failure, worst, damage, knockRange, retardMax: Math.max(...pts.map((p) => p.retarded)), endRpm };
}

function coolingCapacityKw(spec, g, tCoolant, rpm, t = 0) {
  if (g.ev) return Math.max(0, 0.0015 * Math.max(5, g.e.kw) * (tCoolant - T_AMB));
  const cooling = C.byId(C.COOLING, spec.cooling);
  let cap = cooling.cap;
  if (cooling.pcm) cap = t < cooling.duration ? cap : 0.15;          // phase-change jackets are spent after one pass
  const kWperK = 0.36 * g.vd_l * cap * (0.7 + 0.3 * clamp(rpm / 4000, 0, 1)) * (g.blockMat.k_therm > 100 && cooling.air ? 1.2 : 1);
  return Math.max(0, kWperK * (tCoolant - T_AMB));
}
function thermalMassKjK(g) { return g.ev ? 4 + g.e.kg * 0.08 : 10 + 12 * g.vd_l; }

// ---------------------------------------------------------------------------
// Static analysis for the Build tab
// ---------------------------------------------------------------------------
function analyze(spec) {
  const sweep = dynoSweep(spec, { step: Math.max(50, Math.round(spec.revLimit / 40 / 50) * 50), ramp: 1e9, ignoreFailure: true });
  const g = sweep.g;
  const warnings = [];
  const idle = idleRpm(spec, g);
  const L = g.layout;
  const fuel = g.fuel;
  const inj = C.byId(C.INJECTION, spec.injection);
  const sc = C.scavenge(spec);
  const peakP0 = sweep.peakP, peakT0 = sweep.peakT;
  const e = g.e;
  if (!e.none) {
    if (e.kwRaw > e.kw) warnings.push(`${e.volts} V${e.hyb.maxKw && e.kwRaw > e.hyb.maxKw ? ` on a ${e.hyb.id.toUpperCase()} machine` : ""} caps the motor at ${Math.round(e.kw)} kW (you asked for ${Math.round(e.kwRaw)}). Raise the voltage or change topology.`);
    if (e.kwAvail < e.kw * 0.98) warnings.push(`The ${e.hyb.flywheel ? "flywheel" : e.hyb.fc ? "fuel-cell stack" : "battery"} can only deliver ${Math.round(e.kwAvail)} kW of the motor's ${Math.round(e.kw)} kW — bigger store or higher C-rate cells.`);
    if (e.hyb.volts && !e.hyb.volts.includes(e.volts)) warnings.push(`${e.hyb.name.split(" —")[0]} is not built at ${e.volts} V; typical: ${e.hyb.volts.join(" / ")} V.`);
    if (e.hyb.path === "axle") warnings.push(`P4 e-axle adds up to ${Math.round(e.kwAvail * 1.341)} hp at the other axle — not on this engine's dyno curve.`);
    if (e.hyb.path === "series") warnings.push(`Series hybrid: the wheels see the ${Math.round(e.kwAvail * 1.341)} hp traction motor; this engine only charges the pack (${Math.round(peakP0.powerHp * 0.85)} hp of generator output).`);
    if (e.hyb.flywheel) warnings.push("Flywheel KERS holds energy for seconds, not minutes: the bench drains it in about " + Math.round(e.kwhNominal * 3600 / Math.max(1, e.kwAvail)) + " s at full assist.");
    if (!g.ev && e.onCrank) warnings.push(`Electric assist adds up to ${Math.round(e.kwAvail * e.hyb.eff * 1.341)} hp through ${e.hyb.name.split(" ")[0]}; dyno curve shows combined system torque. Battery lasts ~${Math.round(e.kwhNominal * 3600 / Math.max(1, e.kwAvail))} s at full assist.`);
    if (g.ev && e.hyb.fc) warnings.push("Fuel cell: stack response is seconds, not milliseconds — buffer battery covers transients.");
  }
  if (g.ev) {
    if (e.motor.hub) warnings.push("Hub motors: rpm is wheel rpm (×1 reduction). Unsprung mass hurts ride and grip.");
    return { g, sweep, warnings, idle: 0, peakP: peakP0, peakT: peakT0, hpPerL: NaN, worst: sweep.worst };
  }
  if (g.split && spec.cyl % 2) warnings.push("Split-cycle needs cylinder pairs — an odd count leaves one cylinder with nothing to feed.");
  if (g.split) warnings.push("Split-cycle: modelled as a conventional engine of the same total displacement with crossover-valve friction and lower heat loss. Lab data only; no production engine exists.");
  if (g.lateBurn) warnings.push("Hyper-expansion late-burn is a speculative concept: modelled as a fast burn phased 12° later with a 30% lower pressure peak.");
  if (g.axial && spec.cyl % 2 === 0) warnings.push("Axial engines use odd cylinder counts so the swashplate loads cancel.");
  if (g.asp.kind === "wave") warnings.push("Comprex: hot exhaust touches the fresh charge, so the charge runs ~25 °C hotter than a turbo at the same boost; limited to ~13 psi.");
  if (g.asp.wear) warnings.push("Sliding-vane blower: vane tips wear and overheat above about 6500 rpm.");
  if (C.byId(C.INTERCOOLERS, spec.intercooler).o2bonus) warnings.push("Nitrous vaporizer intercooling: counts the extra oxygen as ~12% more air. Bottle empties in seconds; the bench does not stop it.");
  if (C.byId(C.COOLING, spec.cooling).pcm) warnings.push("Phase-change block: full cooling for ~12 s of load, then almost none. Fine for a pass, fatal on a road course.");
  if (!g.rotary) {
    if (spec.rod < spec.stroke * 1.45 && spec.cycle !== "1s") warnings.push("Rod ratio below 1.45: high piston side-load and rod angularity.");
    if (g.hasVT && spec.ivd * g.valveArea_in ** 0.5 > spec.bore * 0.62) warnings.push("Intake valves this big will not fit the bore without shrouding.");
    if (g.hasVT && spec.camLift > C.byId(C.VALVETRAINS, spec.valvetrain).maxlift) warnings.push("Cam lift exceeds what this valvetrain type can follow.");
    if (!g.ci && spec.cr > 12.5 && spec.aspiration !== "na") warnings.push("High compression with boost — expect heavy knock retard on pump fuel.");
    if (g.ci && spec.cr < 14) warnings.push("Compression below 14:1 is too low for reliable compression ignition — hard starting and misfire.");
    if (!g.ci && spec.cr > 16) warnings.push("Compression above 16:1 on a spark engine: knock-limited on every fuel short of methanol/nitromethane.");
    if (g.twoStroke && spec.cr > 12 && !g.ci) warnings.push("Two-stroke trapped compression above 12:1 — residual-heated charge will detonate.");
  }
  if (!fuel.ign.includes(spec.ignition) && !(spec.ignition === "hcci" && fuel.ign.includes("spark"))) warnings.push(`${fuel.name} is not suited to ${C.byId(C.IGNITIONS, spec.ignition).name.toLowerCase()} — expect misfire or runaway pressure rise.`);
  if (g.ci && !inj.ci) warnings.push("Compression ignition needs a diesel injection system (mechanical, unit or common rail); the selected fuel system cannot inject into the cylinder at TDC.");
  if (!g.ci && inj.ci) warnings.push("Diesel injectors chosen on a spark engine — fuel sprays late and burns poorly.");
  if (fuel.phase !== "liquid" && !(inj.gas || inj.recoversGasVe)) warnings.push("Gaseous fuel through a liquid-fuel system — use a gas mixer or direct injection.");
  if (fuel.phase === "liquid" && inj.gas) warnings.push("A gas mixer cannot meter liquid fuel.");
