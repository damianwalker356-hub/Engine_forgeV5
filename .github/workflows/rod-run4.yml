name: Rod beam and split big-end run 4
on:
  push:
    branches: [main]
    paths: [.github/workflows/rod-run4.yml, rod-v4.js, integrate-rod-v4.py, test-rod-v4.cjs]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: rod-run4
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check and integrate rod prototype
        run: |
          node --check rod-v4.js
          python integrate-rod-v4.py
      - name: Run component regressions
        run: |
          node test-explicit-shortblock.cjs
          node test-piston-geometry.cjs
          node test-fit-v3.cjs
          node test-rod-v4.cjs
      - name: Save validated simulator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html small-end-v3.js piston-preview.js
          if ! git diff --cached --quiet; then
            git commit -m 'Embed rod body, split cap and bearing-shell prototypes'
            git push origin HEAD:main
          fi
      - name: Package site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
