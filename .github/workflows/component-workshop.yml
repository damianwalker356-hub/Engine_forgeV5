name: Build component workshop
on:
  push:
    branches: [main]
    paths: [.github/workflows/component-workshop.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install editor
        shell: python
        run: |
          from pathlib import Path
          js = r'''
          (function(G){'use strict';
          const cp=x=>JSON.parse(JSON.stringify(x)),vec=v=>Array.isArray(v)&&v.length===3&&v.every(x=>Number.isFinite(x)&&Math.abs(x)<=100000),empty=()=>({version:1,parts:{},fixtures:[]});
          function valid(a){if(!a||a.version!==1||!a.parts||Array.isArray(a.parts)||!Array.isArray(a.fixtures)||a.fixtures.length>256)throw Error('Invalid assembly');for(const [id,o]of Object.entries(a.parts)){if(['__proto__','prototype','constructor'].includes(id))throw Error('Invalid ID');for(const k of ['offset','rotation','mount'])if(o[k]&&!vec(o[k]))throw Error('Invalid placement');for(const k of ['shape','params'])if(o[k])for(const [n,v]of Object.entries(o[k])){if(n==='pts'){if(!Array.isArray(v)||v.length<2||v.length>64||!v.every(vec))throw Error('Invalid route');}else if(!Number.isFinite(v)||v<=0||v>10000)throw Error('Invalid dimension');if(k==='shape'&&!['r','ri','ro','w','h','d','len','pts'].includes(n))throw Error('Unknown shape field');if(k==='params'&&!['ch','skirt','rodW','length','bigD','smallD','coilD','free','head','stem','journal','mainD','jLen'].includes(n))throw Error('Unknown component field');}}for(const id of Object.keys(a.parts)){let n=id,s=new Set();while(a.parts[n]?.parent){if(s.has(n))throw Error('Attachment cycle');s.add(n);n=a.parts[n].parent;}}const ids=new Set();for(const f of a.fixtures){if(!f||!f.id?.startsWith('custom:')||ids.has(f.id)||!vec(f.pos)||!['box','cyl','path'].includes(f.shape?.t))throw Error('Invalid fixture');ids.add(f.id);const s=f.shape;for(const k of s.t==='box'?['w','h','d']:s.t==='cyl'?['r','h']:['ro','ri'])if(!Number.isFinite(s[k])||s[k]<=0||s[k]>10000)throw Error('Invalid fixture dimension');if(s.t==='path'&&(!Array.isArray(s.pts)||s.pts.length<2||s.pts.length>64||!s.pts.every(vec)))throw Error('Invalid route');if(s.ri!==undefined&&s.ri>=(s.ro||s.r))throw Error('Invalid wall');}return a;}
          function world(p,v,plan){if(!p.frame?.startsWith('bank:'))return v.slice();const a=plan.cyls?.find(c=>c.bankIdx===+p.frame.split(':')[1])?.ang||0;return[v[0],v[1]*Math.cos(a)-v[2]*Math.sin(a),v[1]*Math.sin(a)+v[2]*Math.cos(a)];}
          function apply(raw,a,C){a=valid(a||empty());const p={...raw,parts:cp(raw.parts)};for(const f of a.fixtures)p.parts.push({...cp(f),frame:'root',group:'Custom fixtures',role:'cover',slot:'coverMat',explode:[0,0,0],mat:C.byId(C.MATERIALS,f.material||'s4140'),illustrative:true});for(const q of p.parts){const o=a.parts[q.id]||{};if(o.shape)Object.assign(q.shape,cp(o.shape));if(o.params)Object.assign(q,cp(o.params));if(o.material)q.mat=C.byId(C.MATERIALS,o.material);q.workshop=cp(o);if(q.shape.ri!==undefined&&q.shape.ri>=(q.shape.ro||q.shape.r))throw Error('Invalid inner radius');if(q.dyn==='spring'&&!Number.isFinite(q.stem))q.stem=q.shape.d*1.8;}const by=new Map(p.parts.map(q=>[q.id,q])),done=new Set();function mount(id){if(done.has(id))return;done.add(id);const q=by.get(id),o=a.parts[id];if(!q||!o?.parent)return;mount(o.parent);const t=by.get(o.parent);if(!t||t.workshop.disabled||q.dyn||t.dyn)throw Error('Mount requires two enabled static components');const c=world(t,t.pos,p),off=o.mount||[0,0,0],shift=t.workshop.offset||[0,0,0];q.frame='root';q.pos=c.map((v,i)=>v+off[i]+shift[i]);}for(const id of by.keys())mount(id);p.parts=p.parts.filter(q=>!q.workshop.disabled);return p;}
          function install(M,state){if(G.EFWorkshopInstalled)return;G.EFWorkshopInstalled=true;const C=M.catalog,K=M.e3dcore,original=K.buildPlan;let plan,defaults=[],selected='',undo=[],redo=[],view,gizmo,uid=0;const get=()=>state.spec.assembly||empty(),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const box=document.createElement('details');box.open=true;box.id='componentWorkshop';box.innerHTML='<summary>Component workshop</summary><p>Geometry and packaging edits only. Existing Build inputs drive physics. Mounts use component origins, not measured flange faces. Removing components does not disable physics.</p><div id="cwTools"><button data-a="refresh">Refresh</button><button data-a="undo">Undo</button><button data-a="redo">Redo</button><button data-a="move">Move</button><button data-a="rotate">Rotate</button><button data-a="hide">Hide gizmo</button><button data-a="save">Save engine + assembly</button><button data-a="load">Load assembly</button><input id="cwFile" type="file" accept=".json" hidden></div><div id="cwStatus" role="status"></div><div class="cwGrid"><div><input id="cwSearch" placeholder="Find component"><select id="cwTree" size="12"></select><select id="cwKind"><option value="box">Bracket / plate / spacer</option><option value="cyl">Bolt / cylindrical fitting</option><option value="path">Pipe / hose</option></select><button data-a="add">Add fixture</button></div><div id="cwInspector"></div></div>';
          const css=document.createElement('style');css.textContent='#componentWorkshop{padding:14px;margin:12px;background:#141821;border:1px solid #454b58;border-radius:10px}#componentWorkshop p{font-size:12px;color:#bac2d0}.cwGrid{display:grid;grid-template-columns:1fr 2fr;gap:12px}.cwGrid input,.cwGrid select,.cwGrid textarea{width:100%;box-sizing:border-box}.cwGrid label{display:block;margin:8px 0}.cwXYZ{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}#cwTools{display:flex;flex-wrap:wrap;gap:5px}#cwStatus{color:#ffca80;white-space:pre-wrap}@media(max-width:650px){.cwGrid{grid-template-columns:1fr}}';document.head.append(css);document.getElementById('tab-build').append(box);const $=id=>box.querySelector('#'+id),status=s=>{$('cwStatus').textContent=s;};
          function refresh(){const raw=original(cp(state.spec),{C,E:M.engine,cylinderGeometry:M.render.cylinderGeometry});defaults=cp(raw.parts);plan=apply(raw,get(),C);render();}function change(fn){const a=cp(get());fn(a);valid(a);apply(original(cp(state.spec),{C,E:M.engine,cylinderGeometry:M.render.cylinderGeometry}),a,C);undo.push(cp(get()));if(undo.length>60)undo.shift();redo=[];state.spec.assembly=a;refresh();status('Saved. Open 3D to rebuild. Geometry edits do not change dyno results.');}
          K.buildPlan=(s,d)=>{gizmo?.detach();const raw=original(s,d);defaults=cp(raw.parts);plan=apply(raw,s.assembly,C);queueMicrotask(render);return plan;};G.EFWorkshopDragging=n=>!!(gizmo?.dragging&&gizmo.object===n);G.EFWorkshopPose=nodes=>{for(const n of nodes.values()){if(G.EFWorkshopDragging(n))continue;const o=n.userData.part.workshop;if(!o)continue;const v=o.offset||[0,0,0];n.position.x+=v[0];n.position.y+=v[1];n.position.z+=v[2];if(!n.userData.part.dyn)n.rotation.set(...(o.rotation||[0,0,0]).map(x=>x*Math.PI/180));}};G.EFWorkshopSelect=id=>{if(id){selected=id;render();}};
          G.EFWorkshopViewport=async v=>{view=v;try{const m=await import('https://esm.sh/three@0.160.0/examples/jsm/controls/TransformControls.js');gizmo=new m.TransformControls(v.camera,v.renderer.domElement);v.scene.add(gizmo);gizmo.setSpace('local');gizmo.setTranslationSnap(1);gizmo.setRotationSnap(Math.PI/180);let start;gizmo.addEventListener('dragging-changed',e=>{v.ctl.enabled=!e.value;});gizmo.addEventListener('mouseDown',()=>{start=gizmo.object?.position.clone();});gizmo.addEventListener('mouseUp',()=>{const n=gizmo.object;if(!n||!start)return;const id=n.userData.partId,off=[n.position.x-start.x,n.position.y-start.y,n.position.z-start.z],rot=[n.rotation.x,n.rotation.y,n.rotation.z].map(x=>x*180/Math.PI),mode=gizmo.getMode();try{change(a=>{const o=a.parts[id]||{},old=o.offset||[0,0,0];if(mode==='translate')o.offset=old.map((v,i)=>v+off[i]);else o.rotation=rot;a.parts[id]=o;});}catch(e){status(e.message);}gizmo.detach();});}catch(e){status('Gizmo unavailable; use numeric placement: '+e.message);}};new MutationObserver(()=>{const dest=document.getElementById(state.tab==='view3d'?'tab-view3d':'tab-build');if(dest&&box.parentElement!==dest)dest.append(box);}).observe(document.body,{attributes:true,attributeFilter:['data-tab']});
          function render(){try{if(!plan)return;const all=[...defaults,...get().fixtures],filter=$('cwSearch').value.toLowerCase(),list=all.filter(p=>(p.name+' '+p.group).toLowerCase().includes(filter));if(!list.some(p=>p.id===selected))selected=list[0]?.id||'';$('cwTree').innerHTML=list.map(p=>`<option value="${esc(p.id)}">${esc(p.group||'Fixtures')} / ${esc(p.name)}${get().parts[p.id]?.disabled?' [removed]':''}</option>`).join('');$('cwTree').value=selected;const p=plan.parts.find(p=>p.id===selected)||all.find(p=>p.id===selected);if(!p){$('cwInspector').textContent='No component';return;}const o=get().parts[selected]||{},s=p.shape;let html=`<h3>${esc(p.name)}</h3><small>${esc(p.id)} · ${p.dyn?'kinematically constrained':'static placement'}</small><label>Material<select id="cwMaterial">${C.MATERIALS.filter(m=>!m.coating).map(m=>`<option value="${esc(m.id)}" ${m.id===(o.material||p.material||p.mat?.id)?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`;for(const k of ['offset','rotation'])html+=`<label>${k==='offset'?'Offset XYZ (parent-frame mm)':'Rotation XYZ (degrees)'}<div class="cwXYZ">${(o[k]||[0,0,0]).map(v=>`<input data-v="${k}" type="number" step="any" value="${v}" ${k==='rotation'&&p.dyn?'disabled':''}>`).join('')}</div></label>`;const keys=p.dyn==='piston'?['r']:p.dyn==='spring'?['d']:['rod','valve','crank','cam'].includes(p.dyn)?[]:['r','ri','ro','h','w','d','len'];html+='<h4>Rendered dimensions (mm)</h4>'+keys.filter(k=>typeof s[k]==='number').map(k=>`<label>${k}<input data-s="${k}" type="number" step="any" value="${s[k]}"></label>`).join('');for(const k of ['ch','skirt','rodW','length','bigD','smallD','coilD','free','head','stem','journal','mainD','jLen'])if(typeof p[k]==='number')html+=`<label>${k}<input data-p="${k}" type="number" step="any" value="${p[k]}"></label>`;if(s.pts)html+=`<label>Pipe route [[x,y,z], ...] mm<textarea id="cwPoints" rows="6">${esc(JSON.stringify(s.pts,null,2))}</textarea></label>`;if(!p.dyn)html+=`<h4>Static mount</h4><label>Parent origin<select id="cwParent"><option value="">Manual placement</option>${all.filter(q=>q.id!==selected&&!q.dyn).map(q=>`<option value="${esc(q.id)}" ${q.id===o.parent?'selected':''}>${esc(q.name)}</option>`).join('')}</select></label><label>Mount offset XYZ (root-frame mm)<div class="cwXYZ">${(o.mount||[0,0,0]).map(v=>`<input data-v="mount" type="number" step="any" value="${v}">`).join('')}</div></label>`;html+='<button data-a="apply">Apply edits</button><button data-a="duplicate">Duplicate as fixture</button><button data-a="remove">Remove / restore</button><button data-a="reset">Reset selected part</button><p>Mounts are visual constraints, not fluid or fastener-load solvers. Use Build inputs for physics-critical dimensions.</p>';$('cwInspector').innerHTML=html;}catch(e){status(e.message);}}
          $('cwTree').onchange=()=>{selected=$('cwTree').value;render();};$('cwSearch').oninput=render;box.addEventListener('click',e=>{const action=e.target.closest('[data-a]')?.dataset.a;if(!action)return;try{if(action==='refresh')refresh();if(action==='apply')change(a=>{const o=a.parts[selected]||{};for(const k of ['offset','rotation','mount']){const inputs=box.querySelectorAll(`[data-v="${k}"]`);if(inputs.length)o[k]=Array.from(inputs).map(i=>+i.value);}o.material=$('cwMaterial').value;o.shape={};o.params={};box.querySelectorAll('[data-s]').forEach(i=>o.shape[i.dataset.s]=+i.value);box.querySelectorAll('[data-p]').forEach(i=>o.params[i.dataset.p]=+i.value);if($('cwPoints'))o.shape.pts=JSON.parse($('cwPoints').value);if($('cwParent'))o.parent=$('cwParent').value;a.parts[selected]=o;});if(action==='add')change(a=>{const id='custom:'+Date.now().toString(36)+'-'+(++uid),kind=$('cwKind').value;a.fixtures.push({id,name:$('cwKind').selectedOptions[0].textContent,material:'s4140',pos:[0,350,0],shape:kind==='box'?{t:'box',w:60,h:8,d:40}:kind==='cyl'?{t:'cyl',r:6,h:50}:{t:'path',ro:25,ri:23,pts:[[0,0,0],[100,0,0],[150,80,0]]}});selected=id;});if(action==='duplicate')change(a=>{const p=plan.parts.find(p=>p.id===selected);if(!p||!['box','cyl','path'].includes(p.shape.t))throw Error('Only boxes, cylinders and pipes can be duplicated');const id='custom:'+Date.now().toString(36)+'-'+(++uid);a.fixtures.push({id,name:p.name+' copy',material:p.mat?.id||'s4140',pos:world(p,p.pos,plan),shape:cp(p.shape)});selected=id;});if(action==='remove')change(a=>{const o=a.parts[selected]||{};o.disabled=!o.disabled;a.parts[selected]=o;});if(action==='reset')change(a=>{delete a.parts[selected];});if(action==='undo'&&undo.length){redo.push(cp(get()));state.spec.assembly=undo.pop();refresh();}if(action==='redo'&&redo.length){undo.push(cp(get()));state.spec.assembly=redo.pop();refresh();}if(action==='move'||action==='rotate'){const n=view?.nodes.get(selected);if(!n||!gizmo)throw Error('Open 3D first to initialize handles');if(n.userData.part.dyn)throw Error('Use numeric offsets for moving mechanisms');gizmo.setMode(action==='move'?'translate':'rotate');gizmo.attach(n);status('Drag handles in 3D. Release to save.');}if(action==='hide')gizmo?.detach();if(action==='save'){const u=URL.createObjectURL(new Blob([JSON.stringify({app:'Engine Forge',version:4,spec:state.spec},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='engine-forge-assembly.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}if(action==='load')$('cwFile').click();}catch(e){status(e.message);}});$('cwFile').onchange=async()=>{try{const f=$('cwFile').files[0];if(!f)return;const j=JSON.parse(await f.text()),a=j.spec?.assembly||j.assembly||j;valid(a);change(v=>Object.assign(v,cp(a)));status('Assembly loaded onto current engine. Use normal Build loader for all settings.');}catch(e){status(e.message);}finally{$('cwFile').value='';}};refresh();}
          G.EngineForgeWorkshop={empty,valid,apply,install};if(typeof module!=='undefined')module.exports=G.EngineForgeWorkshop;
          })(typeof window==='undefined'?globalThis:window);
          '''
          Path('workshop.js').write_text(js)
          html=Path('index.html').read_text()
          if '<!-- EF_WORKSHOP_V1 -->' not in html:
              edits=[('__M["main"] = (function () {',js+'\n__M["main"] = (function () {'),('window.__forge = state; // for QA','window.__forge = state; // for QA\nwindow.EngineForgeWorkshop.install(__M,state);'),('pose(sim.crank || 0, $("e3dExp").value / 100);','pose(sim.crank || 0, $("e3dExp").value / 100); if(window.EFWorkshopPose)window.EFWorkshopPose(nodes);'),('function select(id) {','function select(id) { if(window.EFWorkshopSelect)window.EFWorkshopSelect(id);'),('new ResizeObserver(resize).observe(host); resize();','new ResizeObserver(resize).observe(host); resize(); if(window.EFWorkshopViewport)window.EFWorkshopViewport({T,renderer,camera,ctl,scene,nodes});'),('</head>','<!-- EF_WORKSHOP_V1 -->\n</head>')]
              for old,new in edits:
                  if html.count(old)!=1:raise ValueError('Missing or ambiguous anchor: '+old)
                  html=html.replace(old,new,1)
              loop='for (const n of nodes.values()) { const p = n.userData.part'
              if loop not in html:raise ValueError('Missing pose loop')
              html=html.replace(loop,'for (const n of nodes.values()) { if(window.EFWorkshopDragging&&window.EFWorkshopDragging(n))continue; const p = n.userData.part')
          Path('index.html').write_text(html)
      - name: Validate
        run: |
          node --check workshop.js
          node - <<'JS'
          const a=require('node:assert/strict'),K=require('./workshop.js');
          K.valid(K.empty());a.throws(()=>K.valid({version:9}));a.throws(()=>K.valid({...K.empty(),parts:{a:{offset:[Infinity,0,0]}}}));a.throws(()=>K.valid({...K.empty(),parts:{a:{shape:{r:-1}}}}));a.throws(()=>K.valid({...K.empty(),parts:{a:{parent:'b'},b:{parent:'a'}}}));
          const raw={parts:[],cyls:[]},s=K.empty(),C={MATERIALS:[{id:'steel'}],byId:a=>a[0]};s.fixtures=[{id:'custom:a',pos:[20,0,0],shape:{t:'box',w:10,h:10,d:10}},{id:'custom:b',pos:[0,0,0],shape:{t:'box',w:10,h:10,d:10}}];s.parts['custom:b']={parent:'custom:a',mount:[5,0,0]};a.deepEqual(K.apply(raw,s,C).parts[1].pos,[25,0,0]);a.equal(raw.parts.length,0);
          JS
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script\s*>',Path('index.html').read_text(),re.I)
          if not scripts:raise ValueError('No scripts found')
          with tempfile.TemporaryDirectory() as d:
              for i,s in enumerate(scripts):
                  p=Path(d)/f'check-{i}.js';p.write_text(s);subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html workshop.js
          if ! git diff --cached --quiet; then
            git commit -m 'Embed editable component workshop into simulator'
            git push origin HEAD:main
          fi
      - name: Package site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
