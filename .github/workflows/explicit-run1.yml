name: Explicit specification run 1
on:
  push:
    branches: [main]
    paths: [.github/workflows/explicit-run1.yml, explicit-shortblock.js, test-explicit-shortblock.cjs, integrate-explicit.py]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: explicit-run1
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check specification and construction data
        run: |
          node --check explicit-shortblock.js
          node test-explicit-shortblock.cjs
      - name: Integrate readiness checklist and generation guard
        run: python integrate-explicit.py
      - name: Save integrated HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Embed explicit specification checklist and complete-model gate'
            git push origin HEAD:main
          fi
      - name: Package site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
